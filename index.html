              const highestLevel = Math.max(previousSavedLevel, level);
              nextWeaponLevels[weaponType] = highestLevel;
              nextWeaponMastery[weaponType] = Math.min(2, 1 + highestLevel * 0.05);
            }
            const prevForge = prev.enhancement?.forgeStats || {};
            return {
              ...prev,
              wallet: {
                ...prev.wallet,
                cash: Math.max(0, remainingCash),
              },
              enhancement: {
                ...prev.enhancement,
                weaponLevels: nextWeaponLevels,
                weaponMastery: nextWeaponMastery,
                inventory: (prev.enhancement?.inventory || []).map((candidate) =>
                  candidate.instanceId === instanceId
                    ? { ...candidate, enhanceLevel: level }
                    : candidate,
                ),
                lastEnhancementResult: {
                  itemName: item.name,
                  success: successes > 0,
                  level,
                  broken: false,
                  salvageShards: 0,
                  prevLevel: Math.floor(toFiniteNumber(item.enhanceLevel, 0)),
                  cost: toFiniteNumber(prev.wallet?.cash, 0) - remainingCash,
                  baseChance: getEnhanceChance(Math.max(0, level - 1)),
                  breakChance: 0,
                  stabilizerUsed: false,
                  autoAttempts: attempts,
                  autoSuccesses: successes,
                  autoFailures: failures,
                },
                forgeStats: {
                  totalAttempts: toFiniteNumber(prevForge.totalAttempts, 0) + attempts,
                  totalSuccesses: toFiniteNumber(prevForge.totalSuccesses, 0) + successes,
                  totalFailures: toFiniteNumber(prevForge.totalFailures, 0) + failures,
                  totalBreakages: toFiniteNumber(prevForge.totalBreakages, 0),
                  totalShardsEarned: toFiniteNumber(prevForge.totalShardsEarned, 0),
                },
              },
              meta: {
                ...prev.meta,
                lastGrowthResult:
                  language === "ko"
                    ? `자동 강화 완료: +${level} / 시도 ${attempts}회 / 성공 ${successes}회`
                    : `Auto enhance done: +${level}, ${attempts} attempt(s), ${successes} success(es)`,
              },
            };
          });
        };

        const requestEnhance = (instanceId, useStabilizer = false) => {
          const item = gameState.enhancement.inventory.find(
            (candidate) => candidate.instanceId === instanceId,
          );
          if (
            !item ||
            item.type !== "weapon" ||
            item.broken === true ||
            item.locked === true
          )
            return;
          const currentLevel = clampNumber(
            Math.floor(toFiniteNumber(item.enhanceLevel, 0)),
            0,
            MAX_ENHANCE_LEVEL,
            0,
          );
          if (currentLevel >= MAX_ENHANCE_LEVEL) return;

          // Live risk ladder: danger zone is target level +11 and up (currentLevel >= 10)
          const isDangerZone = currentLevel >= 10;
          if (isDangerZone) {
            const breakPct = currentLevel >= 20 ? 70 : 20;
            // Danger zone — show confirmation modal
            setForgeConfirmTarget({
              instanceId,
              useStabilizer,
              itemName: item.name,
              level: currentLevel,
              breakPct,
              successPct: Math.round(
                (getEnhanceChance(currentLevel) +
                  (useStabilizer ? STABILIZER_SUCCESS_BONUS : 0)) *
                  100,
              ),
              stabCount: toFiniteNumber(gameState.enhancement.stabilizers, 0),
            });
          } else {
            // Safe zone — enhance directly
            enhanceWeaponItem(instanceId, useStabilizer);
          }
        };

        // J-3I: Bulk salvage all broken unlocked weapons
        const bulkSalvageBrokenWeapons = () => {
          const brokenUnlocked = gameState.enhancement.inventory.filter(
            (item) => item.broken === true && item.locked !== true,
          );
          if (brokenUnlocked.length === 0) return;
          updateGameState((prev) => {
            const brokenUnlockedIds = new Set(
              prev.enhancement.inventory
                .filter((item) => item.broken === true && item.locked !== true)
                .map((item) => item.instanceId),
            );
            return {
              ...prev,
              enhancement: {
                ...prev.enhancement,
                inventory: prev.enhancement.inventory.filter(
                  (item) => !brokenUnlockedIds.has(item.instanceId),
                ),
              },
            };
          });
        };

        const equipWeaponToCharacter = (
          characterInstanceId,
          weaponInstanceId,
        ) => {
          updateGameState((prev) => {
            const characterExists = prev.rpg.characters.some(
              (character) => character.instanceId === characterInstanceId,
            );
            const weapon = prev.enhancement.inventory.find(
              (item) =>
                item.instanceId === weaponInstanceId && item.type === "weapon",
            );
            if (!characterExists || !weapon) return prev;
            if (weapon.broken === true) return prev; // J-3G: broken weapons cannot be equipped

            return {
              ...prev,
              rpg: {
                ...prev.rpg,
                characters: prev.rpg.characters.map((character) => {
                  if (character.instanceId === characterInstanceId) {
                    return {
                      ...character,
                      equippedWeaponInstanceId: weapon.instanceId,
                    };
                  }
                  if (
                    character.equippedWeaponInstanceId === weapon.instanceId
                  ) {
                    return {
                      ...character,
                      equippedWeaponInstanceId: null,
                    };
                  }
                  return character;
                }),
                run: {
                  ...prev.rpg?.run,
                  activeUnits: (prev.rpg?.run?.activeUnits || []).map((unit) => {
                    if (unit.instanceId === characterInstanceId) {
                      return { ...unit, equippedWeaponInstanceId: weapon.instanceId };
                    }
                    if (unit.equippedWeaponInstanceId === weapon.instanceId) {
                      return { ...unit, equippedWeaponInstanceId: null };
                    }
                    return unit;
                  }),
                },
              },
            };
          });
        };

        const unequipWeaponFromCharacter = (characterInstanceId) => {
          updateGameState((prev) => ({
            ...prev,
            rpg: {
              ...prev.rpg,
              characters: prev.rpg.characters.map((character) =>
                character.instanceId === characterInstanceId
                  ? { ...character, equippedWeaponInstanceId: null }
                  : character,
              ),
              run: {
                ...prev.rpg?.run,
                activeUnits: (prev.rpg?.run?.activeUnits || []).map((unit) =>
                  unit.instanceId === characterInstanceId
                    ? { ...unit, equippedWeaponInstanceId: null }
                    : unit,
                ),
              },
            },
          }));
        };

        const acknowledgeDorothyProposal = () => {
          updateGameState((prev) => ({
            ...prev,
            rpg: {
              ...prev.rpg,
              normalEndingSeen: true,
            },
          }));
        };

        const handleRestart = () => {
          const newDefaults = createDefaultGameState(language);
          setGameState({
            ...newDefaults,
            settings: {
              ...newDefaults.settings,
              language: gameState.settings?.language || language,
            },
          });
        };

        const buyRpgUpgrade = (key) => {
          const validKeys = ["atkLevel", "spdLevel", "penLevel"];
          if (!validKeys.includes(key)) return;

          updateGameState((prev) => {
            if (!prev.rpg?.upgrades) return prev;
            const currentLevel = toFiniteNumber(prev.rpg.upgrades[key], 0);
            const cost = getRpgUpgradeCost(key, currentLevel);
            const currentDividends = toFiniteNumber(prev.rpg.dividends, 0);

            if (currentDividends < cost) return prev;

            return {
              ...prev,
              rpg: {
                ...prev.rpg,
                dividends: currentDividends - cost,
                upgrades: {
                  ...prev.rpg.upgrades,
                  [key]: currentLevel + 1,
                },
              },
            };
          });
        };


        const getSettlementValidationReasonText = (validation) => {
          if (!validation || validation.canSettle) {
            return language === "ko"
              ? "계약, 투입 자본, 배당률 조건이 충족되었습니다. 실제 작전 정산을 실행할 수 있습니다."
              : "Contract, stake, and payout checks are satisfied. Real settlement is available.";
          }
          const checks = validation.checks || {};
          if (!checks.contractSelected) {
            return language === "ko"
              ? "정산할 히어로즈 페이트 계약을 먼저 선택하십시오."
              : "Select a Hero's Fate contract first.";
          }
          if (!checks.stakePositive) {
            return language === "ko"
              ? "작전에 투입할 자본을 1 이상 입력하십시오."
              : "Enter a stake greater than zero.";

          if (!checks.stakeWithinCash) {
            return language === "ko"
              ? "투입 자본이 현재 작전 자본보다 큽니다."
              : "Stake exceeds current operation capital.";

          return language === "ko"
            ? "계약 조건을 다시 확인하십시오."
            : "Review the contract conditions.";

        const CapitalBridgePanel = ({ context = "investment" }) => {
          const bridgeUnlocked =
            context === "investment" ||
            (isNormalEndingReached(gameState.rpg) && gameState.rpg?.normalEndingSeen === true);
          const maxAmount = Math.max(0, Math.floor(toFiniteNumber(cash, 0)));
          const currentSliderValue = Math.min(
            maxAmount,
            Math.max(0, Math.floor(toFiniteNumber(bridgeSliderAmounts[context], maxAmount))),

            : (ui.bridgeLocked || (language === "ko" ? "Stage 100 이후 도로시 브릿지 수락 시 해금됩니다." : "Unlocked after Stage 100 and Dorothy Bridge acceptance."));
          const setSliderToMax = () => setBridgeSliderAmounts((prev) => ({ ...prev, [context]: maxAmount }));
          const executeTransfer = () => {
            const amount = Math.min(maxAmount, Math.max(0, Math.floor(toFiniteNumber(selectedAmount, 0))));
            if (!bridgeUnlocked || amount <= 0) return;
            if (context === "investment") transferCashToInvestment(amount);

          return (

                    {language === "ko" ? "전환량" : "Amount"}

                  <span className="text-sm font-black text-emerald-300">
                    {formatDps(selectedAmount)} / MAX {formatDps(maxAmount)}
                  </span>
                </div>
                <input
                  type="range"
                  min="0"
                  max={maxAmount}
                  step={Math.max(1, Math.floor(maxAmount / 1000))}
                  value={selectedAmount}
                  disabled={!bridgeUnlocked || maxAmount <= 0}
                  onChange={(event) => {
                    const value = Math.max(0, Math.min(maxAmount, Math.floor(toFiniteNumber(event.target.value, 0))));
                    setBridgeSliderAmounts((prev) => ({ ...prev, [context]: value }));
                  }}
                  className="w-full accent-emerald-500"
                />
                <div className="grid grid-cols-2 gap-2">
                  <button
                    type="button"
                    onClick={setSliderToMax}
                    disabled={!bridgeUnlocked || maxAmount <= 0}
                    className={`rounded-md py-2 text-xs font-black transition-colors action-readable ${bridgeUnlocked && maxAmount > 0 ? "bg-slate-700 text-white hover:bg-slate-600" : "bg-slate-800 text-slate-500 cursor-not-allowed"}`}
                  >
                    MAX
                  </button>
                  <button
                    type="button"
                    data-repeat-click="true"
                    onClick={executeTransfer}
                    disabled={!bridgeUnlocked || selectedAmount <= 0}
                    className={`rounded-md py-2 text-xs font-black transition-colors action-readable ${bridgeUnlocked && selectedAmount > 0 ? "bg-emerald-700 text-white hover:bg-emerald-600 border border-emerald-500/50" : "bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700"}`}
                  >
                    {context === "investment" ? ui.boostCapital : (ui.convertToDividends || "DIV")} {formatDps(selectedAmount)}
                  </button>
                </div>
              </div>
            </div>
          );
        };

        const renderSparkline = (history) => {
          const points = normalizePriceHistory(history, 1);
          const min = Math.min(...points);
          const max = Math.max(...points);
          const range = Math.max(1, max - min);
          const path = points
            .map((point, index) => {
              const x =
                points.length === 1 ? 100 : (index / (points.length - 1)) * 200;
              const y = 56 - ((point - min) / range) * 48;
              return `${index === 0 ? "M" : "L"} ${x.toFixed(1)} ${y.toFixed(1)}`;
            })
            .join(" ");

          return (
            <svg
              viewBox="0 0 200 64"
              className="w-full h-16 mt-4"
              role="img"
              aria-label="Recent price history"
            >
              <path
                d="M 0 56 L 200 56"
                stroke="#e5e7eb"
                strokeWidth="1"
                fill="none"
              />
              <path
                d={path}
                stroke="#0f766e"
                strokeWidth="3"
                fill="none"
                strokeLinecap="round"
                strokeLinejoin="round"
              />
            </svg>
          );
        };

        const rarityTextClass = (rarity) => {
          if (rarity === "Mythic") return "text-emerald-800";
          if (rarity === "Legendary") return "text-emerald-700";
          if (rarity === "Unique") return "text-emerald-600";
          if (rarity === "Epic") return "text-green-700";
          if (rarity === "Rare") return "text-green-600";
          return "text-gray-600";
        };

        const defenseStabilityIndex = Math.round(
          Math.min(
            100,
            Math.max(
              0,
              50 +
                investmentAssets.reduce((s, a) => s + a.gainLossPercent, 0) /
                  Math.max(1, investmentAssets.length),
            ),
          ),
        );
        const heroSurvivalIndex = Math.min(
          100,
          Math.round(
            ((gameState.rpg?.highestStage || 0) / NORMAL_ENDING_STAGE) * 100,
          ),
        );
        const raidConfidence = Math.round(
          Math.min(
            100,
            Math.max(
              10,
              totalNetWorth > 0
                ? Math.min(
                    100,
                    (totalPortfolioValue / Math.max(1, totalNetWorth)) * 100,
                  )
                : 20,
            ),
          ),
        );
        const dominantFaction = (() => {
          const entries = Object.entries(ownedFactionCounts);
          if (entries.length === 0) return "None";
          return entries.sort((a, b) => b[1] - a[1])[0][0];
        })();
        const capitalPressure =
          totalNetWorth > 0
            ? Math.round(
                Math.min(
                  100,
                  Math.max(0, (1 - cash / Math.max(1, totalNetWorth)) * 100),
                ),
              )
            : 0;

        const tabs = [
          { id: "landlord", label: ui.tabLandlord },
          { id: "investment", label: ui.tabInvestment },
          { id: "enhancement", label: ui.tabEnhancement },
          { id: "rpg", label: ui.tabRpg },
        ];

        return (
          <div className="w-full max-w-4xl flex flex-col items-center relative">
            {systemToast && (
              <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-[120] animate-in fade-in slide-in-from-top-4 duration-300">
                <div
                  className={`px-4 py-2.5 rounded-xl border shadow-xl flex items-center gap-2 text-xs font-bold ${
                    systemToast.tone === "success"
                      ? "bg-zinc-950/90 text-emerald-400 border-emerald-800/40 shadow-emerald-950/20 shadow-lg"
                      : "bg-zinc-950/90 text-red-400 border-red-800/40 shadow-red-950/20 shadow-lg"
                  }`}
                >
                  <span>{systemToast.tone === "success" ? "🏆" : "🚨"}</span>
                  <span>{systemToast.text}</span>
                </div>
              </div>
            )}


            {gachaSummaryModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[118] flex items-center justify-center p-4" onClick={() => setGachaSummaryModal(null)}>
                <div className="w-full max-w-md bg-slate-950 border border-emerald-800/40 rounded-2xl p-5 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                  <div className="flex items-start justify-between gap-3 mb-4">
                    <div>
                      <div className="text-[10px] font-black text-emerald-400 uppercase tracking-widest">
                        {gachaSummaryModal.type === "character" ? (language === "ko" ? "영웅 호출 결과" : "Hero Call Result") : (language === "ko" ? "무기 호출 결과" : "Weapon Call Result")}
                      </div>
                      <div className="text-xl font-black text-slate-100 mt-1">x{gachaSummaryModal.quantity}</div>
                      <div className="text-[11px] font-bold text-slate-500 mt-1">
                        {language === "ko" ? "등급별 획득 수량 요약" : "Rarity distribution summary"}
                      </div>
                    </div>
                    <button type="button" onClick={() => setGachaSummaryModal(null)} className="rounded-lg px-3 py-1.5 bg-slate-800 text-slate-200 text-xs font-black hover:bg-slate-700 action-readable">
                      {language === "ko" ? "닫기" : "Close"}
                    </button>
                  </div>
                  <div className="grid grid-cols-3 gap-2 mb-4">
                    {Object.entries(gachaSummaryModal.rarityCounts || {}).map(([rarity, count]) => (
                      <div key={`summary-${rarity}`} className="bg-slate-900 border border-slate-800 rounded-lg p-2 text-center">
                        <div className={`text-[10px] font-black uppercase ${rarityTextClass(rarity)}`}>{rarity}</div>
                        <div className="text-lg font-black text-slate-100">{count}</div>
                      </div>
                    ))}
                  </div>
                  <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">
                    {language === "ko" ? "상위 획득 목록" : "Top Pulls"}
                  </div>
                  <div className="max-h-56 overflow-y-auto custom-scrollbar scroll-panel-soft space-y-1.5 pr-1">
                    {(gachaSummaryModal.topItems || []).map((item, index) => (
                      <div key={`summary-item-${item.instanceId || item.id}-${index}`} className="flex items-center justify-between bg-slate-900/80 border border-slate-800 rounded-md px-3 py-2">
                        <div className="min-w-0 w-full">
                          <div className="text-xs font-black text-slate-100 truncate">{displayGachaItemName(item)}</div>
                          <div className={`text-[10px] font-black uppercase ${rarityTextClass(item.rarity)}`}>{item.rarity}</div>
                        </div>
                        <div className="text-[11px] font-black text-slate-400">{formatDps(item.power)}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
            {showCorruptionNotice && (
              <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-[115] flex items-center justify-center p-4">
                <div className="w-full max-w-sm bg-zinc-950 border border-red-950 rounded-2xl p-6 shadow-2xl relative overflow-hidden animate-in fade-in zoom-in duration-200">
                  <div className="absolute inset-0 bg-[linear-gradient(to_bottom,rgba(255,255,255,0.01)_1px,transparent_1px),linear-gradient(to_right,rgba(255,255,255,0.01)_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none opacity-20" />
                  <div className="absolute -top-24 -left-24 w-48 h-48 bg-red-500/10 rounded-full blur-3xl pointer-events-none" />

                  <div className="relative z-10 text-center">
                    <div className="w-12 h-12 bg-red-950/40 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-800/40">
                      <span className="text-xl">🚨</span>
                    </div>

                    <h3 className="text-[10px] font-black text-red-500 uppercase tracking-widest leading-none mb-1.5">
                      Save File Error
                    </h3>
                    <h2 className="text-base font-black text-white tracking-tight leading-snug mb-3">
                      저장 데이터 오류
                    </h2>

                    <p className="text-[11px] font-medium text-zinc-400 mb-5 leading-relaxed text-left">
                      저장 파일을 불러올 수 없어 초기화되었습니다. 이전에 내보낸

                    </p>

                    <div className="flex gap-2.5">
                      <button
                        onClick={() => setShowCorruptionNotice(false)}
                        className="flex-1 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white font-bold text-xs uppercase tracking-wider rounded-xl border border-zinc-800 transition-colors cursor-pointer"
                      >
                        새로 시작
                      </button>
                      <button
                        onClick={() => {
                          setShowCorruptionNotice(false);
                          setShowImportModal(true);
                        }}
                        className="flex-1 py-2.5 bg-red-950/40 hover:bg-red-900/40 text-red-400 font-black text-xs uppercase tracking-wider rounded-xl border border-red-800/60 transition-colors cursor-pointer"
                      >
                        데이터 복구
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {showImportModal && (
              <div
                className="fixed inset-0 bg-black/85 backdrop-blur-md z-[110] flex items-center justify-center p-4"
                onClick={() => {
                  setShowImportModal(false);
                  setImportText("");
                  setImportError(null);
                }}
              >
                <div
                  className="w-full max-w-md bg-zinc-950 border border-zinc-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden animate-in fade-in duration-200"
                  onClick={(e) => e.stopPropagation()}
                >
                  {/* Tactical grid background overlay */}
                  <div className="absolute inset-0 bg-[linear-gradient(to_bottom,rgba(255,255,255,0.01)_1px,transparent_1px),linear-gradient(to_right,rgba(255,255,255,0.01)_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none opacity-20" />
                  <div className="absolute -top-24 -left-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none" />

                  <div className="relative z-10">
                    <div className="flex items-center gap-3 border-b border-zinc-800 pb-4 mb-4">
                      <div className="p-2 bg-amber-950/40 rounded-lg border border-amber-800/40">
                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          className="h-5 w-5 text-amber-500"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke="currentColor"
                        >
                          <path
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            strokeWidth={2}
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                          />
                        </svg>
                      </div>
                      <div>
                        <h3 className="text-[10px] font-black text-zinc-500 uppercase tracking-widest leading-none mb-1">
                          Data Recovery
                        </h3>
                        <h2 className="text-lg font-black text-white tracking-tight leading-none">
                          {language === "ko"
                            ? "데이터 복구 (저장 코드 붙여넣기)"
                            : "Import Save Data"}
                        </h2>
                      </div>
                    </div>

                          <div className="text-[8px] font-bold text-gray-400 uppercase mt-0.5">
                            {ui.preview}
                          </div>
                        </div>
                        <div className="bg-gray-50 p-2 rounded border border-gray-100 col-span-2">
                          <div className="text-[9px] font-black text-gray-400 uppercase">
                            {ui.criticalChance}
                          </div>
                          <div className="text-sm font-black text-emerald-700">
                            {(combatStats.crt * 100).toFixed(1)}%
                          </div>
                          <div className="text-[8px] font-bold text-gray-400 uppercase mt-0.5">
                            {ui.includesRarityBonus}
                          </div>
                        </div>
                        {/* L-4: Mod bonus preview line — shows aggregate mod contribution, hidden when zero */}
                        {(() => {
                          const inv2 = Array.isArray(
                            gameState.enhancement?.inventory,
                          )
                            ? gameState.enhancement.inventory
                            : [];
                          const activeUnits2 =
                            gameState.rpg?.run?.activeUnits || [];
                          const squadSz = Math.max(1, activeUnits2.length);
                          const aggBonus = activeUnits2.reduce(
                            (acc, unit) => {
                              const w2 = getEquippedWeaponForCharacter(
                                unit,
                                inv2,
                              );
                              const b2 = getWeaponModBonus(w2);
                              return {
                                atk: acc.atk + (isFinite(b2.atk) ? b2.atk : 0),
                                pen: acc.pen + (isFinite(b2.pen) ? b2.pen : 0),
                                acc: acc.acc + (isFinite(b2.acc) ? b2.acc : 0),
                                crt: acc.crt + (isFinite(b2.crt) ? b2.crt : 0),
                                spd: acc.spd + (isFinite(b2.spd) ? b2.spd : 0),
                              };
                            },
                            { atk: 0, pen: 0, acc: 0, crt: 0, spd: 0 },
                          );
                          const parts = [];
                          if (isFinite(aggBonus.pen) && aggBonus.pen > 0)
                            parts.push(
                              `PEN +${((aggBonus.pen / squadSz) * 100).toFixed(0)}%`,
                            );
                          if (isFinite(aggBonus.crt) && aggBonus.crt > 0)
                            parts.push(
                              `CRT +${((aggBonus.crt / squadSz) * 100).toFixed(0)}%`,
                            );
                          if (isFinite(aggBonus.spd) && aggBonus.spd > 0)
                            parts.push(
                              `SPD +${((aggBonus.spd / squadSz) * 100).toFixed(0)}%`,
                            );
                          if (isFinite(aggBonus.acc) && aggBonus.acc > 0)
                            parts.push(
                              `ACC +${((aggBonus.acc / squadSz) * 100).toFixed(0)}%`,
                            );
                          if (isFinite(aggBonus.atk) && aggBonus.atk > 0)
                            parts.push(
                              `ATK +${((aggBonus.atk / squadSz) * 100).toFixed(0)}%`,
                            );
                          if (parts.length === 0) return null;
                          return (
                            <div className="bg-gray-50 p-2 rounded border border-amber-200/60 col-span-2">
                              <div className="text-[9px] font-black text-amber-700 uppercase">
                                {language === "ko"
                                  ? "⚡ 개조 보너스"
                                  : "⚡ Mod Bonus"}
                              </div>
                              <div className="text-[9px] font-bold text-amber-600 leading-tight mt-0.5">
                                {parts.join(" | ")}
                              </div>
                            </div>
                          );
                        })()}
                      </div>
                    </div>
                    <section className="bg-white border border-gray-100 rounded-lg overflow-hidden shadow-sm">
                      <div className="bg-emerald-800 text-white p-3 flex justify-between items-center">
                        <h2 className="text-xs font-black uppercase tracking-widest">
                          {ui.dividendsUpgrades}
                        </h2>
                        <div className="text-emerald-200 font-black text-sm">
                          {formatDps(gameState.rpg?.dividends || 0)} DIV
                        </div>
                      </div>
                      <div className="p-3 space-y-3">
                        <div className="rounded-lg border border-emerald-100 bg-emerald-50 p-3 text-[10px] font-bold text-emerald-800 leading-relaxed">
                          전투 특성 훈련은 실제 전투에 직접 반영됩니다. ATK는 실제 피해량을 올리고, SPD는 초당 타격량을 올려 적 처치와 배당금 획득 속도를 높입니다. 단, 전투력은 오버플로우 방지를 위해 로그 기반/제어 성장식으로 계산됩니다.
                        </div>
                        {/* ATK Upgrade */}
                        <div className="flex items-center justify-between gap-4 bg-gray-50 p-3 rounded-lg border border-gray-100">
                          <div>
                            <div className="text-xs font-black text-gray-800 uppercase">
                              {ui.atkBoost} (Lv.
                              {getRpgUpgradeLevel(gameState, "atkLevel")})
                            </div>
                            <div className="text-[10px] font-bold text-emerald-600">
                              {ui.teamDpsMultiplier}: x
                              {getRpgUpgradeEffect(
                                "atkLevel",
                                getRpgUpgradeLevel(gameState, "atkLevel"),
                              ).toFixed(2)}
                            </div>
                          </div>
                          <button
                            data-repeat-click="true"
                            onClick={() => buyRpgUpgrade("atkLevel")}
                            disabled={
                              (gameState.rpg?.dividends || 0) <
                              getRpgUpgradeCost(
                                "atkLevel",
                                getRpgUpgradeLevel(gameState, "atkLevel"),
                              )
                            }
                            className={`px-4 py-2 rounded-md font-black text-xs transition-all ${(gameState.rpg?.dividends || 0) >= getRpgUpgradeCost("atkLevel", getRpgUpgradeLevel(gameState, "atkLevel")) ? "bg-emerald-600 text-white shadow-sm hover:bg-emerald-700" : "bg-gray-200 text-gray-400 cursor-not-allowed"}`}
                          >
                            {formatDps(
                              getRpgUpgradeCost(
                                "atkLevel",
                                getRpgUpgradeLevel(gameState, "atkLevel"),
                              ),
                            )}
                          </button>
                        </div>

                        {/* SPD Upgrade */}
                        <div className="flex items-center justify-between gap-4 bg-gray-50 p-3 rounded-lg border border-gray-100">
                          <div>
                            <div className="text-xs font-black text-gray-800 uppercase">
                              {ui.spdBoost} (Lv.
                              {getRpgUpgradeLevel(gameState, "spdLevel")})
                            </div>
                            <div className="text-[10px] font-bold text-emerald-600">
                              {ui.combatFreqMultiplier}: x
                              {getRpgUpgradeEffect(
                                "spdLevel",
                                getRpgUpgradeLevel(gameState, "spdLevel"),
                              ).toFixed(2)}
                            </div>
                          </div>
                          <button
                            data-repeat-click="true"
                            onClick={() => buyRpgUpgrade("spdLevel")}
                            disabled={
                              (gameState.rpg?.dividends || 0) <
                              getRpgUpgradeCost(
                                "spdLevel",
                                getRpgUpgradeLevel(gameState, "spdLevel"),
                              )
                            }
                            className={`px-4 py-2 rounded-md font-black text-xs transition-all ${(gameState.rpg?.dividends || 0) >= getRpgUpgradeCost("spdLevel", getRpgUpgradeLevel(gameState, "spdLevel")) ? "bg-emerald-600 text-white shadow-sm hover:bg-emerald-700" : "bg-gray-200 text-gray-400 cursor-not-allowed"}`}
                          >
                            {formatDps(
                              getRpgUpgradeCost(
                                "spdLevel",
                                getRpgUpgradeLevel(gameState, "spdLevel"),
                              ),
                            )}
                          </button>
                        </div>

                        {/* PEN Upgrade */}
                        <div className="flex items-center justify-between gap-4 bg-gray-50 p-3 rounded-lg border border-gray-100 opacity-80">
                          <div>
                            <div className="text-xs font-black text-gray-800 uppercase">
                              {ui.penBoost} (Lv.
                              {getRpgUpgradeLevel(gameState, "penLevel")})
                            </div>
                            <div className="text-[10px] font-bold text-emerald-600">
                              {ui.defPenetration}:{" "}
                              {(
                                getRpgUpgradeEffect(
                                  "penLevel",
                                  getRpgUpgradeLevel(gameState, "penLevel"),
                                ) * 100
                              ).toFixed(1)}
                              %
                            </div>
                            <div className="text-[8px] font-black text-gray-400 uppercase mt-1">
                              * {ui.readyForInfiniteMode}
                            </div>
                          </div>
                          <button
                            data-repeat-click="true"
                            onClick={() => buyRpgUpgrade("penLevel")}
                            disabled={
                              (gameState.rpg?.dividends || 0) <
                              getRpgUpgradeCost(
                                "penLevel",
                                getRpgUpgradeLevel(gameState, "penLevel"),
                              )
                            }
                            className={`px-4 py-2 rounded-md font-black text-xs transition-all ${(gameState.rpg?.dividends || 0) >= getRpgUpgradeCost("penLevel", getRpgUpgradeLevel(gameState, "penLevel")) ? "bg-emerald-700 text-white shadow-sm hover:bg-emerald-800" : "bg-gray-200 text-gray-400 cursor-not-allowed"}`}
                          >
                            {formatDps(
                              getRpgUpgradeCost(
                                "penLevel",
                                getRpgUpgradeLevel(gameState, "penLevel"),
                              ),
                            )}
                          </button>
                        </div>
                      </div>
                    </section>

                    <div className="bg-white border border-gray-200 rounded-lg p-4">
                      <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">
                        {ui.topSquad}
                      </h2>
                      {top5Characters.length > 0 ? (
                        <div className="space-y-2">
                          {top5Characters.map((char, index) => (
                            <div
                              key={char.instanceId}
                              className="flex items-center justify-between gap-3 bg-gray-50 rounded-md p-3 border-l-4 border-emerald-500"
                            >
                              <div className="flex items-center gap-3">
                                <div className="bg-emerald-100 text-emerald-700 w-6 h-6 flex items-center justify-center rounded-full text-xs font-black">
                                  {index + 1}
                                </div>
                                <div>
                                  <div className="font-black text-gray-800 text-sm">
                                    {char.name}
                                  </div>
                                  <div
                                    className={`text-[10px] font-bold uppercase ${rarityTextClass(char.rarityLabel)}`}
                                  >
                                    {char.rarityLabel} / Lv {char.level}
                                  </div>
                                  <div className="text-[10px] font-bold text-gray-400">
                                    {char.definition.faction} /
                                    {char.equippedWeapon
                                      ? char.equippedWeapon.name
                                      : ui.noWeapon}
                                  </div>
                                  {/* L-5A: Mod badge in squad card — role tag + name + stat */}
                                  {(() => {
                                    const squadMod =
                                      Array.isArray(
                                        char.equippedWeapon?.mods,
                                      ) && char.equippedWeapon.mods.length > 0
                                        ? char.equippedWeapon.mods[0]
                                        : null;
                                    if (!squadMod) return null;
                                    const sqPool = getModPoolEntry(squadMod.id);
                                    const sqRole = sqPool?.role ?? null;
                                    const sqColor =
                                      sqPool?.roleColor ?? "text-zinc-400";
                                    const sqGlyph = sqPool?.roleGlyph ?? "";
                                    const firstEntry = squadMod.statBonus
                                      ? Object.entries(squadMod.statBonus)[0]
                                      : null;
                                    const statDisplay = firstEntry
                                      ? `+${isFinite(firstEntry[1]) ? (firstEntry[1] * 100).toFixed(0) : "?"}%`
                                      : "";
                                    return (
                                      <div className="flex items-center gap-1 flex-wrap mt-0.5 min-w-0">
                                        {sqRole && (
                                          <span
                                            className={`text-[7px] font-black ${sqColor} leading-tight flex-shrink-0`}
                                          >
                                            {sqGlyph} [{sqRole}]
                                          </span>
                                        )}
                                        <span className="text-[9px] font-black text-amber-400 leading-tight truncate">
                                          {language === "ko"
                                            ? squadMod.name?.kr
                                            : squadMod.name?.en}
                                        </span>
                                        {statDisplay && (
                                          <span className="text-[7px] font-bold text-amber-500/70 leading-tight flex-shrink-0">
                                            {statDisplay}
                                          </span>
                                        )}
                                      </div>
                                    );
                                  })()}
                                </div>
                              </div>
                              <div className="text-right">
                                <div className="text-[10px] font-bold text-gray-400 uppercase">
                                  DPS
                                </div>
                                <div className="font-black text-emerald-600">
                                  {formatDps({ log10: char.totalDpsLog10 })}
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="py-8 text-center font-bold text-gray-400">
                          {ui.startRunToDeploy}
                        </div>
                      )}
                    </div>

                    <div className="bg-white border border-gray-200 rounded-lg p-4">
                      <div className="flex items-center justify-between mb-3">
                        <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">
                          {ui.commandRoster || (language === "ko" ? "전선 편성 / 보유 영웅 스펙" : "Command Roster / Owned Hero Specs")}
                        </h2>
                        <div className="text-xs font-black text-gray-500">
                          {ownedCharacterDetails.length}
                        </div>
                      </div>
                      {ownedCharacterDetails.length > 0 ? (
                        <div className="space-y-2 max-h-80 overflow-y-auto custom-scrollbar">
                          {visibleCommandRosterCharacters.map((character) => {
                            const levelProfile = getCharacterLevelPowerProfile(character);
                            const weaponProfile = getWeaponPowerProfile(character.equippedWeapon);
                            const levelDps = levelProfile.value;
                            const weaponDps = weaponProfile.value;
                            const projectedProfile = getProjectedCharacterPowerProfile(
                              character,
                              enhancementInventory,
                              gameState.enhancement,
                              ownedFactionCounts[character.definition.faction] || 0,
                            );
                            const projectedDps = projectedProfile;
                            const inSquad = (gameState.rpg?.run?.activeUnits || []).some(
                              (unit) => unit.instanceId === character.instanceId,
                            );
                            return (
                              <div key={`roster-${character.instanceId}`} className="bg-gray-50 rounded-md p-3 border border-gray-100">
                                <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                                  <div className="min-w-0 w-full">
                                    <div className="font-black text-gray-800 text-sm truncate">
                                      {character.name}
                                    </div>
                                    <div className={`text-[10px] font-bold uppercase ${rarityTextClass(character.rarityLabel)}`}>
                                      {character.rarityLabel} / {character.definition.faction} / Lv {character.level}/{getCharacterLevelCap(character)} / BT {Math.floor(toFiniteNumber(character.breakthroughTier, 0))}/10 / ★{character.stars}/30
                                    </div>
                                    <div className="grid grid-cols-2 gap-x-3 gap-y-1 mt-2 text-[10px] font-bold text-gray-500">
                                      <div>{language === "ko" ? "기본 전력" : "Base"}: <span className="text-gray-800">{formatDps(levelDps)}</span></div>
                                      <div>{language === "ko" ? "무기" : "Weapon"}: <span className="text-gray-800">{formatDps(weaponDps)}</span></div>
                                      <div>{language === "ko" ? "시너지" : "Synergy"}: <span className={character.synergyActive ? "text-emerald-600" : "text-gray-400"}>x{character.synergyMultiplier.toFixed(2)}</span></div>
                                      <div>{language === "ko" ? "총 전력" : "Total"}: <span className="text-emerald-700">{formatDps(projectedDps)}</span></div>
                                    </div>
                                  </div>
                                  <div className="flex flex-col gap-1 shrink-0 text-right">
                                    <span className={`rounded px-2 py-1 text-[10px] font-black ${inSquad ? "bg-emerald-100 text-emerald-700" : "bg-gray-100 text-gray-500"}`}>
                                      {inSquad ? (language === "ko" ? "편성 중" : "Deployed") : (language === "ko" ? "예비 영웅" : "Reserve")}
                                    </span>
                                    <span className="text-[9px] font-bold text-gray-400 leading-tight">
                                      {language === "ko" ? "편성/성장/분해는 쿼터마스터에서 관리" : "Manage squad/growth/recycle in Quartermaster"}
                                    </span>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        <div className="py-6 text-center font-bold text-gray-400">
                          {ui.noOwnedCharacters || (language === "ko" ? "보유 영웅이 없습니다. 쿼터마스터에서 영웅 호출을 진행하십시오." : "No owned heroes yet. Call supplies from Smith & Shards.")}
                        </div>
                      )}
                    </div>

                    <div className="bg-white border border-gray-200 rounded-lg p-4">
                      <div className="flex items-center justify-between mb-3">
                        <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">
                          {ui.recentRunResults}
                        </h2>
                        <div className="text-xs font-black text-gray-500">
                          {runResultHistory.length}
                        </div>
                      </div>
                      {runResultHistory.length > 0 ? (
                        <div className="space-y-2">
                          {[...runResultHistory].reverse().map((entry) => (
                            <div
                              key={entry.id}
                              className="bg-gray-50 rounded-md p-3 flex items-center justify-between gap-3"
                            >
                              <div>
                                <div className="font-black text-gray-800 text-sm">
                                  {entry.result === "clear"
                                    ? ui.clearedRun
                                    : ui.retreatedRun}
                                </div>
                                <div className="text-[10px] font-bold text-gray-400 uppercase">
                                  {language === "ko"
                                    ? `스테이지 ${entry.stage} / 처치 ${entry.defeatedMonsters}`
                                    : `Stage ${entry.stage} / ${entry.defeatedMonsters} kills`}
                                </div>
                              </div>
                              <div className="text-[10px] font-black text-emerald-700">
                                {new Date(
                                  toFiniteNumber(entry.createdAt, Date.now()),
                                ).toLocaleTimeString()}
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="py-6 text-center font-bold text-gray-400">
                          {ui.noRunHistory}
                        </div>
                      )}
                    </div>

                    <div className="bg-white border border-gray-200 rounded-lg p-4">
                      <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                        {ui.battleNotice}
                      </h2>
                      <p className="text-xs text-gray-500 leading-relaxed">
                        {ui.battleNoticeText}
                      </p>
                    </div>
                  </div>
                </section>
              )}
            </div>

            {/* Tab-specific SEO content for search engines */}
            {(() => {
              const guideContent = SEO_TAB_CONTENT[language]?.[activeTab] ?? SEO_TAB_CONTENT.en?.[activeTab] ?? null;
              if (!guideContent) return null;
              return (
                <details className="w-full max-w-4xl mt-6 mb-20 bg-white border border-emerald-100 rounded-lg shadow-sm overflow-hidden">
                  <summary className="guide-summary cursor-pointer px-4 py-3 text-sm font-black text-emerald-800 bg-emerald-50 border-b border-emerald-100 select-none">
                    <span className="guide-open-label">{language === "ko" ? "공략집 열기" : "Open Strategy Guide"}</span>
                    <span className="guide-close-label">{language === "ko" ? "공략집 닫기" : "Close Strategy Guide"}</span>
                  </summary>
                  <div>{guideContent}</div>
                </details>
              );
            })()}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(
        <AppErrorBoundary>
          <GameApp />
        </AppErrorBoundary>,
      );
    </script>
    <script>
      window.addEventListener("error", (event) => {
        console.error("[WINDOW_ERROR]", event.error || event.message);
      });
      window.addEventListener("unhandledrejection", (event) => {
        console.error("[UNHANDLED_REJECTION]", event.reason);
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
