      @keyframes anvil-shake-kf {
        0% {
          transform: translate(1px, 1px) rotate(0deg);
        }

        10% {
          transform: translate(-1px, -2px) rotate(-1deg);
        }

        20% {
          transform: translate(-3px, 0px) rotate(1deg);
        }

        30% {
          transform: translate(0px, 2px) rotate(0deg);
        }

        40% {
          transform: translate(1px, -1px) rotate(1deg);
        }

        50% {
          transform: translate(-1px, 2px) rotate(-1deg);
        }

        60% {
          transform: translate(-3px, 1px) rotate(0deg);
        }

        70% {
          transform: translate(2px, 1px) rotate(-1deg);
        }

        80% {
          transform: translate(-1px, -1px) rotate(1deg);
        }

        90% {
          transform: translate(2px, 2px) rotate(0deg);
        }

        100% {
          transform: translate(1px, -2px) rotate(-1deg);
        }

      class AppErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { error: null };
        }

        static getDerivedStateFromError(error) {
          return { error };
        }

        componentDidCatch(error, info) {
          console.error("[APP_RENDER_ERROR]", error, info);
        }

        render() {
          if (!this.state.error) return this.props.children;
          const message = this.state.error?.message || String(this.state.error);
          return (
            <div className="min-h-screen w-full flex items-center justify-center bg-slate-950 text-slate-100 p-5">

      // Defense Contract preview helpers ??derived-only, no state mutation
      function getDefenseContractRiskTier(asset) {
        const vol = toFiniteNumber(asset.volatility, 0.05);
        if (vol <= 0.03) return { label: "Stable", color: "text-emerald-600" };
        if (vol <= 0.07) return { label: "Volatile", color: "text-yellow-600" };
        return { label: "High Risk", color: "text-red-500" };
      }

      function getDefenseContractOdds(asset, highestStage) {
        const id = asset?.id;
        const contractBaseOdds = {
          "secure-frontline-bond": 92,
          "blue-chip-stock": 80,
          "growth-stock": 55,
          "meme-coin": 28,
          "reaper-derivative": 9,
          "abyss-option": 3,
        };
        if (contractBaseOdds[id] != null) return contractBaseOdds[id];
        const vol = toFiniteNumber(asset?.volatility, 0.05);
        return Math.round(Math.max(5, Math.min(92, 92 - Math.pow(vol, 0.55) * 220)));
      }

      function getDefenseContractProjectedPayout(
        asset,
        highestStage,
        squadDps,
      ) {
        const id = asset?.id;
        const contractPayouts = {
          "secure-frontline-bond": 1.06,
          "blue-chip-stock": 1.24,
          "growth-stock": 1.95,
          "meme-coin": 4.2,
          "reaper-derivative": 14,
          "abyss-option": 55,
        };
        const baseMultiplier = contractPayouts[id] ?? Math.max(1.05, 1 + toFiniteNumber(asset?.volatility, 0.05) * 12);
        const dps = toFiniteNumber(squadDps, 0);
        const dpsBonus = dps > 0 ? Math.min(0.35, Math.log10(dps + 1) * 0.015) : 0;
        const raw = toFiniteNumber(baseMultiplier + dpsBonus, baseMultiplier);
        return Math.max(1.02, Math.min(99, raw));
      }

      // Derived-only bet slip preview ??no state mutation, no settlement
      function getDefenseContractBetPreview(
        betSlip,
        assetList,
        highestStage,
        squadDps,
      ) {
        const contractId = betSlip?.selectedContractId;
        if (!contractId) return null;
        const asset = (assetList || []).find((a) => a.id === contractId);
        if (!asset) return null;
        const stage = toFiniteNumber(highestStage, 0);
        const dps = toFiniteNumber(squadDps, 0);
        const odds = getDefenseContractOdds(asset, stage);
        const payout = getDefenseContractProjectedPayout(asset, stage, dps);
        const tier = getDefenseContractRiskTier(asset);
        const stake = Math.max(0, toFiniteNumber(betSlip?.stake, 0));
        const projectedWin = toFiniteNumber(stake * payout, 0);
        return { asset, odds, payout, tier, stake, projectedWin };
      }

      // Derived-only simulated outcome ??deterministic preview, no random settlement
      // Phase D-1B: Tactical Signal helper ??pure and candidate only
      function calculateDefenseContractTacticalSignal(gameState, asset) {
        const targetFaction = DEFENSE_CONTRACT_FACTION_MAPPING[asset?.id];
        if (!targetFaction)
          return {
            tacticalSignal: 0,
            buildAlignment: 0,
            reason: "No faction mapping",
          };

        const activeUnits = gameState.rpg?.run?.activeUnits || [];
        let factionMatches = 0;
        let rarityBonus = 0;

        activeUnits.forEach((unit) => {
          const def = getCharacterDefinition(unit.characterId);
          if (!def) return;

          if (def.faction === targetFaction) {
            factionMatches++;
          }

          if (def.rarity === "mythic" || def.rarity === "legendary") {
            rarityBonus += 2;
          } else if (def.rarity === "unique" || def.rarity === "epic") {
            rarityBonus += 1;
          }
        });

        const factionSignal = Math.min(10, factionMatches * 2);
        const cappedRaritySignal = Math.min(5, rarityBonus);

        const specStats = getExternalCapitalSpecializationStats(gameState);
        let buildAlignment = 0;
        if (specStats.unlocked) {
          const factionBonusMap = {
            realty: specStats.realtyBonus,
            ticker: specStats.tickerBonus,
            shadow: specStats.shadowBonus,
            luxury: specStats.luxuryBonus,
          };
          const matchingBonus = factionBonusMap[targetFaction] || 0;
          buildAlignment =
            matchingBonus > 0
              ? Math.min(3, Math.round(matchingBonus * 100 * 0.5))
              : 0;
        }

        const combined = Math.min(
          12,
          factionSignal + cappedRaritySignal + buildAlignment,
        );

        return {
          factionSignal,
          raritySignal: cappedRaritySignal,
          buildAlignment,
          tacticalSignal: combined,
          tacticalCap: 12,
          matchedFaction: targetFaction,
          eligibleUnitCount: activeUnits.length,
          matchingFactionCount: factionMatches,
          rarityContribution: rarityBonus,
          reason: `Faction: ${factionSignal}%, Rarity: ${cappedRaritySignal}%, Align: ${buildAlignment}% (Capped at 12%)`,
        };
      }

      // Phase A: Probabilistic success chance helper ??pure and deterministic
      function calculateDefenseContractSuccessChance(
        gameState,
        asset,
        highestStage,
        squadDps,
      ) {
        const stage = toFiniteNumber(highestStage, 0);
        const dps = toFiniteNumber(squadDps, 0);
        const odds = getDefenseContractOdds(asset, stage);

        // RPG-specific signals (Total Max Bonus: +35%)
        // 1. Stage Signal (Progress-based, Max +15%)
        const stageSignal = Math.min(
          15,
          Math.round((stage / NORMAL_ENDING_STAGE) * 15),
        );

        // 2. DPS Signal (Active Combat Power, +5%)
        const dpsSignal = dps > 0 ? 5 : 0;

        // 3. PEN Signal (Armor Penetration utility, +3% per level, Max +15%)
        const penLevel = getRpgUpgradeLevel(gameState, "penLevel");
        const penSignal = Math.min(15, penLevel * 3);

        // Phase D-1B: Candidate tactical signal (Now added to rawChance in Phase D-1D)
        const tacticalCandidate = calculateDefenseContractTacticalSignal(
          gameState,
          asset,
        );

        // Success Formula. Risk bands intentionally remain distinct:
        // safe contracts can sit near 90%, while abyss contracts can remain single-digit
        // unless the squad provides strong tactical signals.
        const highRiskIds = ["meme-coin", "reaper-derivative", "abyss-option"];
        const isExtremeRisk = highRiskIds.includes(asset?.id);
        const supportScale = asset?.id === "abyss-option" ? 0.18 : asset?.id === "reaper-derivative" ? 0.28 : asset?.id === "meme-coin" ? 0.55 : 1;
        const rawChance =
          odds +
          (stageSignal + dpsSignal + penSignal + tacticalCandidate.tacticalSignal) * supportScale;
        const maxChanceByContract = {
          "secure-frontline-bond": 96,
          "blue-chip-stock": 94,
          "growth-stock": 88,
          "meme-coin": 58,
          "reaper-derivative": 22,
          "abyss-option": 9,
        };
        const maxChance = maxChanceByContract[asset?.id] ?? 95;
        const boundedChance = Math.max(3, Math.min(maxChance, Math.round(rawChance)));

        return {
          successChance: boundedChance,
          successProbability: boundedChance / 100,
          rawChance,
          boundedChance,
          minChance: 5,
          maxChance,
          squadSignal: dpsSignal + penSignal,
          contractSignal: odds,
          stageSignal,
          dpsSignal,
          penSignal,
          riskModifier: 0,
          tacticalSignalCandidate: tacticalCandidate,
          explanation: `Base Odds (${odds}%) + RPG Progress (+${stageSignal}%) + Combat Power (+${dpsSignal + penSignal}%) + Tactical Edge (+${tacticalCandidate.tacticalSignal}%).`,
        };
      }

      function getDefenseContractSimulatedOutcome(
        gameState,
        betSlip,
        assetList,
        highestStage,
        squadDps,
      ) {
        const contractId = betSlip?.selectedContractId;
        if (!contractId) return null;
        const asset = (assetList || []).find((a) => a.id === contractId);
        if (!asset) return null;
        const stage = toFiniteNumber(highestStage, 0);
        const dps = toFiniteNumber(squadDps, 0);

        const prob = calculateDefenseContractSuccessChance(
          gameState,
          asset,
          stage,
          dps,
        );
        const successChance = prob.successChance; // Percent scale (5-95)
        const payout = getDefenseContractProjectedPayout(asset, stage, dps);
        const stake = Math.max(0, toFiniteNumber(betSlip?.stake, 0));

        const outcomeLabel =
          successChance >= 60
            ? "Favorable"
            : successChance >= 40
              ? "Neutral"
              : "Unfavorable";
        const projectedGain = toFiniteNumber(stake * (payout - 1), 0);
        const projectedLoss = stake;

        let confidenceLevel;
        if (successChance >= 80) confidenceLevel = "High";
        else if (successChance >= 40) confidenceLevel = "Medium";
        else confidenceLevel = "Low";

        const contractDisplayName =
          DEFENSE_CONTRACT_FLAVOR[asset.id]?.displayName || asset.name;
        // Detailed explanation from the probabilistic helper
        const explanation = `${contractDisplayName} shows a ${successChance}% success probability. ${prob.explanation}`;

        return {
          selectedContractId: contractId,
          contractName: contractDisplayName,
          stake,
          odds: successChance,
          outcomeLabel,
          successChance,
          projectedGain,
          projectedLoss,
          confidenceLevel,
          explanation,
          projectedPayout: payout,
          tacticalSignalCandidate: prob.tacticalSignalCandidate,
        };
      }

      // Pure derived helper — Hero's Fate real settlement is independent of Dorothy.
      // Dorothy belongs to the Stage 100 cross-module capital bridge / Infinite Mode unlock,
      // not to basic Hero's Fate operation execution.
      function isDefenseContractSettlementUnlocked(gameState) {
        return true;

      // Pure validation helper ??no mutation, returns structured canSettle result
      function validateDefenseContractSettlement(
        gameState,
        assetList,
        highestStage,
        squadDps,
      ) {
        const investment = gameState?.investment;
        const capital = toFiniteNumber(gameState?.investment?.capital, 0);
        const contractId = investment?.betSlip?.selectedContractId || null;
        const stake = Math.max(
          0,
          toFiniteNumber(investment?.betSlip?.stake, 0),
        );

        const base = {
          selectedContractId: contractId,
          stake,
          odds: null,
          projectedPayout: null,
        };

        if (!isDefenseContractSettlementUnlocked(gameState)) {
          return {
            ...base,
            canSettle: false,
            reason:
              "Hero's Fate settlement is available. Select a contract and stake capital.",
            checks: {
              settlementUnlocked: false,
              contractSelected: false,
              stakePositive: false,
              stakeWithinCash: false,
              oddsValid: false,
              payoutValid: false,
            },
          };
        }

        const asset = (assetList || []).find((a) => a.id === contractId);
        if (!contractId || !asset) {
          return {
            ...base,
            canSettle: false,
            reason: "No valid contract is selected.",
            checks: {
              settlementUnlocked: true,
              contractSelected: false,
              stakePositive: false,
              stakeWithinCash: false,
              oddsValid: false,
              payoutValid: false,
            },
          };
        }

        if (stake <= 0) {
          return {
            ...base,
            canSettle: false,
            reason: "Stake must be greater than 0.",
            checks: {
              settlementUnlocked: true,
              contractSelected: true,
              stakePositive: false,
              stakeWithinCash: false,
              oddsValid: false,
              payoutValid: false,
            },
          };
        }

        if (stake > capital) {
          return {
            ...base,
            canSettle: false,
            reason: "Stake exceeds available Contract Capital balance.",
            checks: {
              settlementUnlocked: true,
              contractSelected: true,
              stakePositive: true,
              stakeWithinCash: false,
              oddsValid: false,
              payoutValid: false,
            },
          };
        }

        const stage = toFiniteNumber(highestStage, 0);
        const dps = toFiniteNumber(squadDps, 0);
        const odds = getDefenseContractOdds(asset, stage);
        if (!isFinite(odds) || odds <= 0) {
          return {
            ...base,
            odds,
            canSettle: false,
            reason: "Contract odds are invalid.",
            checks: {
              settlementUnlocked: true,
              contractSelected: true,
              stakePositive: true,
              stakeWithinCash: true,
              oddsValid: false,
              payoutValid: false,
            },
          };
        }

        const projectedPayout = getDefenseContractProjectedPayout(
          asset,
          stage,
          dps,
        );
        if (!isFinite(projectedPayout) || projectedPayout <= 0) {
          return {
            ...base,
            odds,
            projectedPayout,
            canSettle: false,
            reason: "Projected payout is invalid.",
            checks: {
              settlementUnlocked: true,
              contractSelected: true,
              stakePositive: true,
              stakeWithinCash: true,
              oddsValid: true,
              payoutValid: false,
            },
          };
        }

        return {
          canSettle: true,
          reason: "All conditions met. Ready to settle.",
          selectedContractId: contractId,
          stake,
          odds,
          projectedPayout,
          checks: {
            settlementUnlocked: true,
            contractSelected: true,
            stakePositive: true,
            stakeWithinCash: true,
            oddsValid: true,
            payoutValid: true,
          },
        };
      }

      // Pure helper ??deterministic dry-run, no Math.random for outcome, no cash mutation
      function createDefenseContractDryRunResult(
        gameState,
        assetList,
        highestStage,
        squadDps,
      ) {
        const validation = validateDefenseContractSettlement(
          gameState,
          assetList,
          highestStage,
          squadDps,
        );
        if (!validation.canSettle) return null;
        const {
          selectedContractId: contractId,
          stake,
          projectedPayout,
        } = validation;
        const asset = (assetList || []).find((a) => a.id === contractId);
        if (!asset) return null;
        const stage = toFiniteNumber(highestStage, 0);
        const dps = toFiniteNumber(squadDps, 0);

        // Use the new probabilistic helper for deterministic dry-run decision
        const prob = calculateDefenseContractSuccessChance(
          gameState,
          asset,
          stage,
          dps,
        );
        const successChance = prob.successChance;

        // Dry-run remains deterministic (Threshold >= 60)
        const wouldWin = successChance >= 60;

        const safePayout = Math.max(1, toFiniteNumber(projectedPayout, 1));
        const safeStake = Math.max(0, toFiniteNumber(stake, 0));
        const netPreview = wouldWin
          ? toFiniteNumber(safeStake * (safePayout - 1), 0)
          : -safeStake;

        return {
          id: `dryrun-${Date.now()}-${Math.floor(Math.random() * 10000)}`,
          contractId,
          contractName:
            DEFENSE_CONTRACT_FLAVOR[contractId]?.displayName || asset.name,
          stake: safeStake,
          odds: successChance, // Display the calculated success chance
          projectedPayout: safePayout,
          successChance,
          wouldWin,
          netPreview,
          createdAt: Date.now(),
          status: "dry-run",
        };
      }

      // Pure helper ??probabilistic settlement result using Math.random()
      function createDefenseContractSettlementResult(
        gameState,
        assetList,
        highestStage,
        squadDps,
      ) {
        const validation = validateDefenseContractSettlement(
          gameState,
          assetList,
          highestStage,
          squadDps,
        );
        if (!validation.canSettle) return null;
        const {
          selectedContractId: contractId,
          stake,
          projectedPayout,
        } = validation;
        const asset = (assetList || []).find((a) => a.id === contractId);
        if (!asset) return null;

        const stage = toFiniteNumber(highestStage, 0);
        const dps = toFiniteNumber(squadDps, 0);

        // Phase C: Probabilistic settlement using the dedicated helper
        const prob = calculateDefenseContractSuccessChance(
          gameState,
          asset,
          stage,
          dps,
        );
        const successChance = prob.successChance; // Percent scale (5-95)
        const successProbability = prob.successProbability; // Decimal scale (0.05-0.95)

        // The real random roll
        const wouldWin = Math.random() < successProbability;

        const safePayout = Math.max(1, toFiniteNumber(projectedPayout, 1));
        const safeStake = Math.max(0, toFiniteNumber(stake, 0));
        const netResult = wouldWin
          ? toFiniteNumber(safeStake * (safePayout - 1), 0)
          : -safeStake;

        return {
          id: `settled-${Date.now()}-${Math.floor(Math.random() * 10000)}`,
          contractId,
          contractName:
            DEFENSE_CONTRACT_FLAVOR[contractId]?.displayName || asset.name,
          stake: safeStake,
          odds: successChance, // Record the actual chance for history
          projectedPayout: safePayout,
          successChance,
          wouldWin,
          netResult,
          createdAt: Date.now(),
          status: "settled",
        };
      }

      const SUPPORTED_LANGUAGES = ["ko", "en", "ja"];

      function resolveSupportedLanguage(language, fallback = "en") {
        const raw = String(language || "").toLowerCase();
        if (raw.startsWith("ko")) return "ko";
        if (raw.startsWith("ja")) return "ja";
        if (raw.startsWith("en")) return "en";
        return SUPPORTED_LANGUAGES.includes(fallback) ? fallback : "en";
      }

      function detectPreferredLanguage() {
        const candidates = [
          navigator.language,
          navigator.userLanguage,
          ...(Array.isArray(navigator.languages) ? navigator.languages : []),
        ].filter(Boolean);
        for (const candidate of candidates) {
          const resolved = resolveSupportedLanguage(candidate, null);
          if (resolved) return resolved;
        }
        return "en";
      }

      function getPropertyDataLanguage(language) {
        return resolveSupportedLanguage(language) === "ko" ? "ko" : "en";
      }

      function pickLocalized(language, ko, en, ja) {
        const resolved = resolveSupportedLanguage(language);
        if (resolved === "ko") return ko;
        if (resolved === "ja") return ja ?? en;
        return en;
      }

      function toFiniteNumber(value, fallback = 0) {
        const number = Number(value);
        return Number.isFinite(number) ? number : fallback;
      }

      function formatCompactGlobal(
        val,
        isCurrency = true,
        currencyCode = "USD",
      ) {
        const num = Number(val);
        if (val === undefined || val === null || Number.isNaN(num)) {
          return isCurrency ? (currencyCode === "KRW" ? "₩0" : "$0") : "0";
        }
        if (!Number.isFinite(num)) {
          if (num === Infinity) return "∞";
          if (num === -Infinity) return "-∞";
          return isCurrency ? (currencyCode === "KRW" ? "₩0" : "$0") : "0";
        }

        if (isCurrency) {
          return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: currencyCode,
            notation: "compact",
            maximumFractionDigits: 1,
          }).format(num);
        } else {
          return new Intl.NumberFormat("en-US", {
            notation: "compact",
            maximumFractionDigits: 1,
          }).format(num);
        }
      }

      function formatPowerTier(val) {
        const num = Math.abs(toFiniteNumber(val, 0));
        if (num < 1000) return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(num);
        const units = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Ocd", "Nod", "Vg"];
        const tier = Math.floor(Math.log10(num) / 3);
        if (tier < units.length) {
          const scaled = num / Math.pow(1000, tier);
          const digits = scaled >= 100 ? 0 : scaled >= 10 ? 1 : 2;
          return `${val < 0 ? "-" : ""}${scaled.toFixed(digits)}${units[tier]}`;
        }
        const exponent = Math.floor(Math.log10(num));
        const mantissa = num / Math.pow(10, exponent);
        return `${val < 0 ? "-" : ""}${mantissa.toFixed(2)}e${exponent}`;
      }

      const POWER_NUMBER_CAP = 1e300;

      function clampFinitePower(value, fallback = 0) {
        const number = Number(value);
        if (!Number.isFinite(number)) return fallback;
        return Math.min(POWER_NUMBER_CAP, Math.max(0, number));
      }

      function toPowerNumberFromLog10(log10Value, fallback = 0) {
        const log = Number(log10Value);
        if (!Number.isFinite(log)) return fallback;
        if (log <= -300) return 0;
        if (log >= 300) return POWER_NUMBER_CAP;
        return Math.pow(10, log);
      }

      function formatPowerFromLog10(log10Value) {
        const log = Number(log10Value);
        if (!Number.isFinite(log)) return "0";
        if (log < 300) return formatPowerTier(Math.pow(10, log));
        const exponent = Math.floor(log);
        const mantissa = Math.pow(10, log - exponent);
        return `${mantissa.toFixed(2)}e${exponent}`;
      }

      function addPowerLogs(logA, logB) {
        const a = Number(logA);
        const b = Number(logB);
        if (!Number.isFinite(a)) return b;
        if (!Number.isFinite(b)) return a;
        const high = Math.max(a, b);
        const low = Math.min(a, b);
        if (high - low > 12) return high;
        return high + Math.log10(1 + Math.pow(10, low - high));
      }

      function formatDps(val) {
        if (val && typeof val === "object" && Number.isFinite(val.log10)) {
          return formatPowerFromLog10(val.log10);
        }
        return formatPowerTier(val);
      }

      function clampNumber(value, min, max, fallback = min) {
        const number = toFiniteNumber(value, fallback);
        return Math.min(max, Math.max(min, number));
      }

      function toOwnedQuantity(value) {
        return Math.max(0, Math.floor(toFiniteNumber(value, 0)));
      }

      function toSafePrice(value, fallbackPrice) {
        return Math.max(0, toFiniteNumber(value, fallbackPrice));
      }

      function normalizePriceHistory(history, fallbackPrice) {
        const safeFallback = Math.max(1, Math.round(fallbackPrice));
        const source = Array.isArray(history) ? history : [];
        const cleaned = source

          .filter((point) => Number.isFinite(point) && point > 0)
          .slice(-INVESTMENT_HISTORY_LIMIT);

      function normalizeGachaItem(item, fallbackIndex = 0) {

        return {

          power: Math.max(0, toFiniteNumber(item.power, definition.power)),

      function normalizeEquippedCharacterWeapons(characters, inventory) {

      const SIGNATURE_WEAPON_CHARACTER_MAP = {

      function getRarityRankValueGlobal(rarity) {
        const key = String(rarity || "normal").toLowerCase();

      }

      function getCharacterWeaponSynergyKind(character, weapon) {

        const weapon = getEquippedWeaponForCharacter(character, inventory);

        const kind = getCharacterWeaponSynergyKind(character, weapon);
        if (kind === "none") return 1.0;

        const definition = getCharacterDefinition(character?.characterId);
        const charRank = getRarityRankValueGlobal(definition?.rarity);
        const weaponRank = getRarityRankValueGlobal(weapon?.rarity);
        const synergyRarityRank = Math.min(charRank, weaponRank);
        const synergyRarity = ["normal", "rare", "epic", "unique", "legendary", "mythic"][synergyRarityRank] || "normal";
        const enhanceLevel = Math.max(0, toFiniteNumber(weapon.enhanceLevel, 0));
        const base = getRaritySynergyBaseMultiplier(synergyRarity);
        const exactBonus = kind === "signature" ? 0.55 + charRank * 0.08 : 0;
        const enhanceBonus = Math.min(1.6, enhanceLevel * (kind === "signature" ? 0.035 : 0.022));
        return Math.min(6.5, toFiniteNumber(base + exactBonus + enhanceBonus, base));

          Math.log10(Math.max(1, levelMultiplier)) +
          Math.log10(Math.max(1, rarityMultiplier)) +
          Math.log10(Math.max(1, starMultiplier)) +
          Math.log10(Math.max(1, breakthroughMultiplier));

          log10: log10Power,

          levelMultiplier,

        const authorityLvl = getTierLevel([8, 9]); // PEN
        const frontierLvl = getTierLevel([10]); // Pressure Breaker

        const reAtkBonus = foundationLvl * 0.02; // max 6%
        const reAccBonus = communityLvl * 0.01; // max 2%
        const reSpdBonus = enterpriseLvl * 0.01; // max 2%
        const rePenBonus = authorityLvl * 1.5; // max 3 (flat PEN)
        const rePressure = frontierLvl * 0.05; // max 5% DMG bonus vs 101+

        // 2. Investment Specialization
        const holdings = state.investment?.holdings || [];
        const getCostBasis = (id) => {
          const h = holdings.find((h) => h.assetId === id);
          return h
            ? toFiniteNumber(h.buyPrice, 0) * toFiniteNumber(h.quantity, 0)
            : 0;
        };

        const growthBasis = getCostBasis("growth-stock");
        const memeBasis = getCostBasis("meme-coin");
        const netWorth =
          toFiniteNumber(state.wallet?.cash, 0) +
          toFiniteNumber(state.investment?.capital, 0);

        // Faction Bridges
        // Realty: Property Diversity (Unique owned count)
        const uniqueProperties = properties.filter((p) => p.level > 0).length;
        const realtyBonus = Math.min(0.1, uniqueProperties * 0.01);

        // Ticker: Growth Portfolio Value (Ticker-like exposure)
        const tickerBonus = Math.min(
          0.1,
          Math.max(0, Math.log10(growthBasis / 1000000 + 1) * 0.02),
        );

        // Shadow: High-Risk (Meme)
        const shadowBonus = Math.min(
          0.1,
          Math.max(0, Math.log10(memeBasis / 1000000 + 1) * 0.02),
        );

        // Luxury: Absolute Wealth
        const luxuryBonus = Math.min(
          0.1,
          Math.max(0, Math.log10(netWorth / 1000000000 + 1) * 0.02),
        );

        return {
          unlocked: true,
          atkBonus: reAtkBonus,
          accBonus: reAccBonus,
          spdBonus: reSpdBonus,
          penBonus: rePenBonus,
          pressureBreaker: rePressure,
          realtyBonus,
          tickerBonus,
          shadowBonus,
          luxuryBonus,
          explanation: {
            re: `ATK +${(reAtkBonus * 100).toFixed(0)}%, ACC +${(reAccBonus * 100).toFixed(0)}%, SPD +${(reSpdBonus * 100).toFixed(0)}%, PEN +${rePenBonus.toFixed(0)}, PB +${(rePressure * 100).toFixed(0)}%`,
            inv: `RE +${(realtyBonus * 100).toFixed(0)}%, TK +${(tickerBonus * 100).toFixed(0)}%, SH +${(shadowBonus * 100).toFixed(0)}%, LX +${(luxuryBonus * 100).toFixed(0)}%`,
          },
        };
      }

      function getExternalCapitalLeverageStats(state) {
        const isUnlocked = state.rpg?.normalEndingSeen === true;

        // 1. ATK Bonus from Total Wealth (Capped at 50%)
        // Logarithmic scaling rewards growth across many orders of magnitude.
        const cash = toFiniteNumber(state.wallet?.cash, 0);
        const capital = toFiniteNumber(state.investment?.capital, 0);
        const multiplier = toFiniteNumber(state.landlord?.multiplier, 1);
        const wealthProxy = cash + capital + multiplier * 1000000;
        const atkBonus = isUnlocked
          ? Math.min(
              0.5,
              Math.max(0, Math.log10(wealthProxy / 100000 + 1) * 0.05),
            )
          : 0;

        // 2. SPD Bonus from Investment Liquidity (Uninvested Capital) (Capped at 25%)
        // This creates a tactical trade-off: hold liquid capital for SPD, or invest for CRT.
        const spdBonus = isUnlocked
          ? Math.min(
              0.25,
              Math.max(0, Math.log10(capital / 1000000 + 1) * 0.05),
            )
          : 0;

        // 3. PEN Bonus from Rebirth Authority (Capped at 50)
        // Flat additive bonus representing metaphysical progression authority.
        const rebirthCount = toFiniteNumber(state.landlord?.rebirthCount, 0);
        const penBonus = isUnlocked ? Math.min(50, rebirthCount * 2) : 0;

        // 4. CRT Bonus from Investment Portfolio Risk (Cost Basis) (Capped at 15%)
        // Rewards active market participation and risk-taking.
        const holdings = state.investment?.holdings || [];
        const portfolioCostBasis = holdings.reduce(
          (sum, h) =>
            sum + toFiniteNumber(h.buyPrice, 0) * toFiniteNumber(h.quantity, 0),
          0,
        );
        const crtBonus = isUnlocked
          ? Math.min(
              0.15,
              Math.max(0, Math.log10(portfolioCostBasis / 1000000 + 1) * 0.02),
            )
          : 0;

        return {
          unlocked: isUnlocked,
          atkBonus,
          spdBonus,
          penBonus,
          crtBonus,
          explanation: {
            atk: isUnlocked ? `+${(atkBonus * 100).toFixed(1)}%` : "Locked",
            spd: isUnlocked ? `+${(spdBonus * 100).toFixed(1)}%` : "Locked",
            pen: isUnlocked ? `+${penBonus.toFixed(0)}` : "Locked",
            crt: isUnlocked ? `+${(crtBonus * 100).toFixed(1)}%` : "Locked",
          },
        };
      }

      // L-2: Pure helper — reads mods[0].statBonus safely, returns zero-object if empty
      function getWeaponModBonus(weapon) {
        const ZERO_BONUS = { atk: 0, pen: 0, acc: 0, crt: 0, spd: 0 };
        if (!weapon) return ZERO_BONUS;
        const mods = Array.isArray(weapon.mods) ? weapon.mods : [];
        if (mods.length === 0) return ZERO_BONUS;
        const raw = mods[0]?.statBonus;
        if (!raw || typeof raw !== "object") return ZERO_BONUS;
        return {
          atk: isFinite(raw.atk) ? Number(raw.atk) : 0,
          pen: isFinite(raw.pen) ? Number(raw.pen) : 0,
          acc: isFinite(raw.acc) ? Number(raw.acc) : 0,
          crt: isFinite(raw.crt) ? Number(raw.crt) : 0,
          spd: isFinite(raw.spd) ? Number(raw.spd) : 0,
        };
      }

      function getRpgCombatStats(state) {
        const basePowerProfile = getTeamBasePowerProfile(state);
        const baseAtk = basePowerProfile.value;
        const atkLevel = getRpgUpgradeLevel(state, "atkLevel");
        const spdLevel = getRpgUpgradeLevel(state, "spdLevel");
        const penLevel = getRpgUpgradeLevel(state, "penLevel");

        const atkMult = getRpgUpgradeEffect("atkLevel", atkLevel);
        const spdMult = getRpgUpgradeEffect("spdLevel", spdLevel);
        const penEffect = getRpgUpgradeEffect("penLevel", penLevel);

        // Phase G-1 & G-3: External Capital Leverage & Specialization
        const leverage = getExternalCapitalLeverageStats(state);
        const specialization = getExternalCapitalSpecializationStats(state);

        // Future-ready derived stats
        const accBase = 0.95;
        const crtBase = 0.05;

        // Small bonus for Legendary/Mythic characters
        const characters = state.rpg?.run?.activeUnits || [];
        const highTierCount = characters.filter((c) => {
          const def = getCharacterDefinition(c.characterId);
          return def && (def.rarity === "legendary" || def.rarity === "mythic");
        }).length;
        const charCrtBonus = Math.min(0.1, highTierCount * 0.01);

        // Faction-specific specialization bonuses (scaled by faction presence)
        const factionCounts = characters.reduce((acc, c) => {
          const def = getCharacterDefinition(c.characterId);
          if (def) acc[def.faction] = (acc[def.faction] || 0) + 1;
          return acc;
        }, {});

        const factionBonus =
          ((factionCounts.realty || 0) * specialization.realtyBonus +
            (factionCounts.ticker || 0) * specialization.tickerBonus +
            (factionCounts.shadow || 0) * specialization.shadowBonus +
            (factionCounts.luxury || 0) * specialization.luxuryBonus) /
          Math.max(1, characters.length);

        const totalAtkMult =
          atkMult *
          (1 + leverage.atkBonus + specialization.atkBonus + factionBonus);
        const totalSpdMult =
          spdMult * (1 + leverage.spdBonus + specialization.spdBonus);
        const totalCrt = crtBase + charCrtBonus + leverage.crtBonus;
        const totalPen =
          penEffect + (leverage.penBonus + specialization.penBonus) * 0.01;
        const totalAcc = accBase + specialization.accBonus;

        // L-2: Additive weapon mod bonuses — aggregated across all equipped weapons in squad
        // Pure read: getWeaponModBonus never mutates state
        const inventory = Array.isArray(state.enhancement?.inventory)
          ? state.enhancement.inventory
          : [];
        const modBonusTotals = characters.reduce(
          (totals, unit) => {
            const weapon = getEquippedWeaponForCharacter(unit, inventory);
            const bonus = getWeaponModBonus(weapon);
            return {
              atk: totals.atk + (isFinite(bonus.atk) ? bonus.atk : 0),
              pen: totals.pen + (isFinite(bonus.pen) ? bonus.pen : 0),
              acc: totals.acc + (isFinite(bonus.acc) ? bonus.acc : 0),
              crt: totals.crt + (isFinite(bonus.crt) ? bonus.crt : 0),
              spd: totals.spd + (isFinite(bonus.spd) ? bonus.spd : 0),
            };
          },
          { atk: 0, pen: 0, acc: 0, crt: 0, spd: 0 },
        );
        // Average across squad size so a single modded weapon doesn't dominate a 5-unit squad
        const squadSize = Math.max(1, characters.length);
        const modAtk = modBonusTotals.atk / squadSize;
        const modPen = modBonusTotals.pen / squadSize;
        const modAcc = modBonusTotals.acc / squadSize;
        const modCrt = modBonusTotals.crt / squadSize;
        const modSpd = modBonusTotals.spd / squadSize;

        // Pressure Breaker: DMG bonus applied against Stage 101+ enemies
        const currentStage = toFiniteNumber(state.rpg?.currentStage, 1);
        const pressureMult =
          currentStage > 100 ? 1 + specialization.pressureBreaker : 1;

        // L-4: atk mod is a fractional multiplier bonus added to totalAtkMult.
        // QC12: keep a log10 profile beside the capped JS number so displays and sorting
        // do not collapse at 1e300. Actual combat still uses the capped numeric value,
        // but the new controlled growth curve keeps normal gameplay well below that cap.
        const modAtkMult = isFinite(modAtk) ? modAtk : 0;
        const finalAtkMultiplier = Math.max(
          0,
          (totalAtkMult + modAtkMult) * pressureMult,
        );
        const finalSpdMultiplier = Math.max(
          0,
          totalSpdMult + (isFinite(modSpd) ? modSpd : 0),
        );
        const atkLog10 = Number.isFinite(basePowerProfile.log10) && finalAtkMultiplier > 0
          ? basePowerProfile.log10 + Math.log10(finalAtkMultiplier)
          : Number.NEGATIVE_INFINITY;
        const totalDpsLog10 = Number.isFinite(atkLog10) && finalSpdMultiplier > 0
          ? atkLog10 + Math.log10(finalSpdMultiplier)
          : Number.NEGATIVE_INFINITY;
        const safeAtk = toPowerNumberFromLog10(atkLog10, 0);
        const safeTotalDps = toPowerNumberFromLog10(totalDpsLog10, 0);
        return {
          atk: safeAtk,
          atkLog10,
          spd: finalSpdMultiplier,
          pen: totalPen + (isFinite(modPen) ? modPen : 0),
          acc: totalAcc + (isFinite(modAcc) ? modAcc : 0),
          crt: totalCrt + (isFinite(modCrt) ? modCrt : 0),
          totalDps: safeTotalDps,
          totalDpsLog10,
        };
      }

      function getTotalTeamDps(state) {
        return getRpgCombatStats(state).totalDps;
      }

      function getCombatTempoProfile(spdMultiplier) {
        const spd = Math.max(1, toFiniteNumber(spdMultiplier, 1));
        const logSpd = Math.max(0, Math.log2(spd));
        // QC25: faster defense rhythm. Keep visible stage-by-stage progression,
        // but allow high-SPD builds to process up to two monster defeats per tick.
        const tickMs = Math.max(120, Math.min(720, Math.round(720 / (1 + logSpd * 0.85))));
        return {
          tickMs,
          damageTempo: 1,
          rewardTempo: Math.min(1.22, 1 + logSpd * 0.035),
          killCap: spd >= 8 ? 2 : 1,
          stageAdvanceCap: 1,
        };
      }

      function applyCombatTick(state, deltaSeconds) {
        if (state.rpg?.run?.isActive !== true) return state;
        const combatStats = getRpgCombatStats(state);
        const dps = combatStats.totalDps;
        let currentStage = Math.max(1, toFiniteNumber(state.rpg.currentStage, 1));
        let currentHp = toFiniteNumber(state.rpg.monsterHp, getMonsterMaxHp(currentStage));

        const getStageDamageProfile = (stage) => {
          const archetype = getInfiniteMonsterArchetype(stage);
          const bossMilestone = getInfiniteBossMilestone(stage);
          const reaperProfile = getInfiniteReaperProfile(stage);
          const modifier = getInfiniteArchetypeCombatModifier(archetype, combatStats, stage);
          const bossModifier = getInfiniteBossCombatModifier(bossMilestone, combatStats, stage);
          const reaperModifier = getInfiniteReaperCombatModifier(reaperProfile, combatStats, stage);
          let mult =
            toFiniteNumber(modifier.damageMultiplier, 1) *
            toFiniteNumber(bossModifier.damageMultiplier, 1) *
            toFiniteNumber(reaperModifier.damageMultiplier, 1);
          if (stage >= 101) {
            const intensityTier = Math.floor((stage - 100) / 10) + 1;
            mult *= Math.max(0.45, 1 - intensityTier * 0.025);
          }
          return {
            multiplier: Math.max(0.45, Math.min(1, mult)),
            regenRate: toFiniteNumber(modifier.regenRate, 0),
          };
        };

        const initialProfile = getStageDamageProfile(currentStage);
        const tempoProfile = getCombatTempoProfile(combatStats.spd);
        const damageBudget = Math.max(
          0,
          toFiniteNumber(
            dps * Math.max(0, toFiniteNumber(deltaSeconds, 0)) * initialProfile.multiplier * tempoProfile.damageTempo,
            0,
          ),
        );
        if (damageBudget <= 0) return state;

        let remainingDamage = damageBudget;
        let stageKills = Math.max(0, toFiniteNumber(state.rpg.stageKills, 0));
        let defeated = Math.max(0, toFiniteNumber(state.rpg.defeatedMonsters, 0));
        let highestStage = Math.max(0, toFiniteNumber(state.rpg.highestStage, 0));
        let dividendsGained = 0;
        let cashGained = 0;
        let shardsGained = 0;
        let killsThisTick = 0;
        let lastReward = 0;
        let stagesAdvancedThisTick = 0;
        const maxKillsPerTick = tempoProfile.killCap;
        const maxStagesPerTick = Math.max(1, Math.floor(toFiniteNumber(tempoProfile.stageAdvanceCap, 1)));

        while (
          remainingDamage > 0 &&
          killsThisTick < maxKillsPerTick &&
          stagesAdvancedThisTick < maxStagesPerTick
        ) {
          const stageMaxHp = getMonsterMaxHp(currentStage);
          currentHp = Math.min(Math.max(0, currentHp), stageMaxHp);
          if (remainingDamage < currentHp) {
            currentHp -= remainingDamage;
            remainingDamage = 0;
            break;
          }

          remainingDamage -= currentHp;
          defeated += 1;
          killsThisTick += 1;
          stageKills += 1;
          const reward = Math.max(1, Math.floor(getMonsterDefeatReward(currentStage) * tempoProfile.rewardTempo));
          dividendsGained += reward;
          cashGained += reward;
          lastReward += reward;

          if (currentStage >= 101) {
            const baseShardsAwarded = 2;
            const intensityTier = Math.floor((currentStage - 100) / 10) + 1;
            const shardBonus = baseShardsAwarded * Math.max(1, intensityTier) * 0.1;
            shardsGained += Math.max(1, Math.floor(baseShardsAwarded + shardBonus));
          }

          const killsRequired = getKillsRequiredForStage(currentStage);
          if (stageKills >= killsRequired) {
            // QC25: no stage-clear lump sum. The economy now pays only on monster defeat
            // so income feels continuous and synchronized with defense action.
            currentStage += 1;
            stageKills = 0;
            highestStage = Math.max(highestStage, currentStage);
            stagesAdvancedThisTick += 1;
            // QC22: stop after a single visible stage advance. Extra damage is
            // intentionally discarded so the player sees rapid +1 progression
            // instead of 10+ or 100+ stage jumps in one frame.
            currentHp = getMonsterMaxHp(currentStage);
            break;
          }
          currentHp = getMonsterMaxHp(currentStage);
        }

        const currentMaxHp = getMonsterMaxHp(currentStage);
        if (killsThisTick === 0 && currentHp > 0) {
          const endProfile = getStageDamageProfile(currentStage);
          const regen =
            currentMaxHp *
            endProfile.regenRate *
            Math.max(0, toFiniteNumber(deltaSeconds, 0));
          currentHp = Math.min(currentMaxHp, currentHp + regen);
        }

        const reachedNormalEnding =
          state.rpg.normalEndingReached === true || highestStage >= NORMAL_ENDING_STAGE;
        const nextRefinedShards =
          shardsGained > 0
            ? Math.max(0, toFiniteNumber(state.enhancement?.refinedShards, 0) + shardsGained)
            : toFiniteNumber(state.enhancement?.refinedShards, 0);

        return {
          ...state,
          wallet: {
            ...state.wallet,
            cash: Math.max(0, toFiniteNumber(state.wallet?.cash, 0) + cashGained),
          },
          landlord: {
            ...state.landlord,
            totalEarned:
              toFiniteNumber(state.landlord?.totalEarned, 0) + cashGained,
          },
          enhancement:
            shardsGained > 0
              ? {
                  ...state.enhancement,
                  refinedShards: nextRefinedShards,
                }
              : state.enhancement,
          rpg: {
            ...state.rpg,
            currentStage,
            highestStage,
            stageKills,
            monsterHp: Math.min(currentHp, currentMaxHp),
            monsterMaxHp: currentMaxHp,
            defeatedMonsters: defeated,
            dividends: toFiniteNumber(state.rpg.dividends, 0) + dividendsGained,
            lastRpgReward: lastReward,
            lastCombatTickKills: killsThisTick,
            lastCombatTickReward: dividendsGained,
            normalEndingReached: reachedNormalEnding,
            run: {
              ...state.rpg.run,
              stage: currentStage,
              wave: defeated,
            },
          },
        };
      }

      function normalizeGameState(state, language = "en") {
        const defaults = createDefaultGameState(language);
        const landlord = state?.landlord || {};
        const savedProperties = Array.isArray(landlord.properties)
          ? landlord.properties
          : [];
        const investment = state?.investment || {};
        const savedHoldings = Array.isArray(investment.holdings)
          ? investment.holdings
          : [];
        const enhancement = state?.enhancement || {};
        const savedInventory = Array.isArray(enhancement.inventory)
          ? enhancement.inventory
          : [];
        let normalizedInventory = ensureUniqueGachaInstanceIds(
          savedInventory
            .map((item, index) => normalizeInventoryItem(item, index))
            .filter(Boolean),
        );
        let starterWeaponGranted = enhancement.starterWeaponGranted === true;
        if (normalizedInventory.length === 0) {
          const starterWeapon = createStarterWeaponInstance();
          if (starterWeapon) {
            normalizedInventory = [starterWeapon];
            starterWeaponGranted = true;
          }
        }
        const normalizedRecentPulls = ensureUniqueGachaInstanceIds(
          normalizeRecentPulls(enhancement.recentPulls),
        );
        const rpg = state?.rpg || {};
        const savedCharacters = Array.isArray(rpg.characters)
          ? rpg.characters
          : [];
        const normalizedCharacters = ensureUniqueCharacterInstanceIds(
          savedCharacters
            .map((character, index) =>
              normalizeOwnedCharacter(character, index),
            )
            .filter(Boolean),
        );
        const equippedNormalizedCharacters = normalizeEquippedCharacterWeapons(
          normalizedCharacters,
          normalizedInventory,
        );
        const normalizedUnlockedCharacterIds = Array.from(
          new Set([
            ...(Array.isArray(rpg.unlockedCharacterIds)
              ? rpg.unlockedCharacterIds.filter((id) =>
                  getCharacterDefinition(id),
                )
              : []),
            ...equippedNormalizedCharacters.map(
              (character) => character.characterId,
            ),
          ]),
        );
        const normalizedWeaponLevels = normalizedInventory.reduce(
          (levels, item) => {
            if (item.type !== "weapon") return levels;
            const weaponType = getWeaponType(item);
            if (!weaponType) return levels;
            const currentLevel = Math.max(
              0,
              Math.floor(toFiniteNumber(item.enhanceLevel, 0)),
            );
            levels[weaponType] = Math.max(
              Math.floor(toFiniteNumber(levels[weaponType], 0)),
              currentLevel,
            );
            return levels;
          },
          { ...(enhancement.weaponLevels || {}) },
        );
        const normalizedWeaponMastery = Object.keys(
          normalizedWeaponLevels,
        ).reduce(
          (mastery, weaponType) => {
            mastery[weaponType] = Math.min(
              2,
              1 +
                Math.max(
                  0,
                  toFiniteNumber(normalizedWeaponLevels[weaponType], 0),
                ) *
                  0.05,
            );
            return mastery;
          },
          { ...(enhancement.weaponMastery || {}) },
        );
        const run = rpg.run || {};
        const savedActiveUnits = Array.isArray(run.activeUnits)
          ? run.activeUnits
          : [];
        const normalizedRunUnits = ensureUniqueCharacterInstanceIds(
          savedActiveUnits
            .map((character, index) =>
              normalizeOwnedCharacter(character, index),
            )
            .filter(Boolean),
        );
        const normalizedRunHistory = Array.isArray(run.resultHistory)
          ? run.resultHistory
              .filter(
                (entry) =>
                  entry &&
                  typeof entry.id === "string" &&
                  typeof entry.result === "string",
              )
              .slice(-10)
          : [];

        const meta = state?.meta || {};

        return {
          ...defaults,
          ...state,
          version: GAME_STATE_VERSION,
          meta: {
            ...defaults.meta,
            ...meta,
            gameOver:
              meta.gameOver && typeof meta.gameOver === "object"
                ? {
                    reason: String(meta.gameOver.reason || "unknown"),
                    contractName: String(
                      meta.gameOver.contractName || "Unknown",
                    ),
                    stake: toFiniteNumber(meta.gameOver.stake, 0),
                    odds: toFiniteNumber(meta.gameOver.odds, 0),
                    timestamp: toFiniteNumber(
                      meta.gameOver.timestamp,
                      Date.now(),
                    ),
                  }
                : null,
          },
          wallet: {
            ...defaults.wallet,
            ...(state?.wallet || {}),
            cash: Math.max(0, toFiniteNumber(state?.wallet?.cash, 0)),
            blackMarketTokens: Math.max(
              0,
              Math.floor(toFiniteNumber(state?.wallet?.blackMarketTokens, 0)),
            ),
          },
          landlord: {
            ...defaults.landlord,
            ...landlord,
            properties: defaults.landlord.properties.map((property) => {
              const savedProperty = savedProperties.find(
                (item) => item.id === property.id,
              );
              return {
                id: property.id,
                count: toFiniteNumber(savedProperty?.count, 0),
              };
            }),
            rebirthCount: toFiniteNumber(landlord.rebirthCount, 0),
            multiplier: toFiniteNumber(landlord.multiplier, 1),
            totalEarned: toFiniteNumber(landlord.totalEarned, 0),
            clickPower: toFiniteNumber(landlord.clickPower, 10),
            clickUpgradeCost: toFiniteNumber(landlord.clickUpgradeCost, 50),
          },
          investment: {
            ...defaults.investment,
            ...investment,
            capital: Math.max(0, toFiniteNumber(investment.capital, 0)),
            supportGrantClaimed: investment.supportGrantClaimed === true,
            holdings: defaults.investment.holdings.map((holding) => {
              const savedHolding = savedHoldings.find(
                (item) => item.id === holding.id,
              );
              const asset = INVESTMENT_ASSETS.find(
                (item) => item.id === holding.id,
              );
              return {
                id: holding.id,
                name: asset.name,
                type: asset.type,
                price: clampNumber(
                  savedHolding?.price,
                  Math.max(1, asset.price * 0.5),
                  asset.price * 2,
                  asset.price,
                ),
                volatility: asset.volatility,
                owned: toOwnedQuantity(savedHolding?.owned),
                avgBuyPrice: toSafePrice(
                  savedHolding?.avgBuyPrice,
                  savedHolding?.price || asset.price,
                ),
                history: normalizePriceHistory(
                  savedHolding?.history,
                  savedHolding?.price || asset.price,
                ),
              };
            }),
            betSlip: {
              selectedContractId:
                typeof investment.betSlip?.selectedContractId === "string"
                  ? investment.betSlip.selectedContractId
                  : null,
              stake: Math.max(0, toFiniteNumber(investment.betSlip?.stake, 0)),
            },
            contractHistory: Array.isArray(investment.contractHistory)
              ? investment.contractHistory
                  .filter(
                    (e) =>
                      e &&
                      typeof e.id === "string" &&
                      typeof e.contractId === "string" &&
                      typeof e.contractName === "string" &&
                      typeof e.stake === "number" &&
                      typeof e.odds === "number" &&

      function migrateLegacyStateIfNeeded(language = "en") {
        const legacyRaw = localStorage.getItem(LEGACY_LANDLORD_STORAGE_KEY);

          migrated.wallet.cash = toFiniteNumber(legacy.money, 0);

              return {
                id: property.id,
                count: toFiniteNumber(savedProperty?.count, 0),

            },
          );
          migrated.landlord.rebirthCount = toFiniteNumber(

          const normalized = normalizeGameState(migrated, language);
          saveGameState(normalized);
          localStorage.removeItem(LEGACY_LANDLORD_STORAGE_KEY);

          console.warn("Unable to migrate legacy Idle Landlord state.", error);

      function processOfflineProgress(normalizedState) {
        const lastSavedAt = normalizedState.settings?.lastSavedAt;
        if (lastSavedAt) {
          const lastSavedTime = new Date(lastSavedAt).getTime();
          if (isFinite(lastSavedTime) && lastSavedTime > 0) {
            const elapsedSeconds = Math.max(
              0,
              Math.min(
                (Date.now() - lastSavedTime) / 1000,
                MAX_OFFLINE_SECONDS,
              ),
            );
            if (isFinite(elapsedSeconds) && elapsedSeconds >= 60) {
              const offlineMinutes = Math.floor(elapsedSeconds / 60);
              if (offlineMinutes >= 1) {
                // Calculate Landlord current passive income
                const landlordMultiplier = toFiniteNumber(
                  normalizedState.landlord?.multiplier,
                  1,
                );
                const lang =

                const initialProperties = (

                    count: toFiniteNumber(savedProperty?.count, 0),

                const currentIncomePerSec =
                  initialProperties.reduce(
                    (total, prop) => total + prop.baseIncome * prop.count,
                    0,
                  ) * landlordMultiplier;

                const currentIncomePerSecClean =
                  isFinite(currentIncomePerSec) && currentIncomePerSec > 0
                    ? currentIncomePerSec
                    : 0;
                const offlineCash =
                  offlineMinutes * 60 * currentIncomePerSecClean;
                const finalOfflineCash =
                  isFinite(offlineCash) && offlineCash > 0
                    ? Math.floor(offlineCash)
                    : 0;

                // Calculate shards earned in Infinite Mode (Stage >= 101)
                const stage =
                  normalizedState.rpg?.currentStage ??
                  normalizedState.rpg?.stage ??
                  1;
                let shardsEarned = 0;
                if (stage >= 101) {
                  const intensityTier = Math.floor((stage - 100) / 10) + 1;
                  if (isFinite(intensityTier) && intensityTier > 0) {
                    const baseRate = 2 + 2 * intensityTier * 0.05;
                    const calculatedShards = offlineMinutes * baseRate;
                    if (isFinite(calculatedShards) && calculatedShards > 0) {
                      shardsEarned = Math.floor(calculatedShards);
                    }
                  }
                }
                if (!isFinite(shardsEarned) || shardsEarned < 0) {
                  shardsEarned = 0;
                }

                if (finalOfflineCash > 0 || shardsEarned > 0) {
                  const prevCash = toFiniteNumber(
                    normalizedState.wallet?.cash,
                    0,
                  );
                  const prevTotalEarned = toFiniteNumber(
                    normalizedState.landlord?.totalEarned,
                    0,
                  );
                  const prevShards = toFiniteNumber(
                    normalizedState.enhancement?.refinedShards,
                    0,
                  );

                  const nextCash = prevCash + finalOfflineCash;
                  const nextTotalEarned = prevTotalEarned + finalOfflineCash;
                  const nextShards = prevShards + shardsEarned;

                  const nowStr = new Date().toISOString();
                  const updatedState = {
                    ...normalizedState,
                    wallet: {
                      ...normalizedState.wallet,
                      cash: isFinite(nextCash) ? nextCash : prevCash,
                    },
                    landlord: {
                      ...normalizedState.landlord,
                      totalEarned: isFinite(nextTotalEarned)
                        ? nextTotalEarned
                        : prevTotalEarned,
                    },
                    enhancement: {
                      ...normalizedState.enhancement,
                      refinedShards: isFinite(nextShards)
                        ? nextShards
                        : prevShards,
                    },
                    settings: {

                    },
                    tempOfflineProgress: {
                      minutes: offlineMinutes,
                      cashEarned: finalOfflineCash,
                      shardsEarned: shardsEarned,
                    },
                  };

                  // Save updated state to localStorage immediately
                  saveGameState(updatedState);
                  return updatedState;
                }
              }
            }
          }
        }
        return normalizedState;

      let initialCorruptionDetected = false;

      function loadGameState(language = "en") {
        const savedRaw = localStorage.getItem(GAME_STATE_STORAGE_KEY);

        if (savedRaw) {
          try {
            const trimmedRaw = savedRaw.trim();
            let parsedData = null;

            if (trimmedRaw.startsWith("{")) {
              // Backward Compatibility: Plain JSON
              parsedData = JSON.parse(trimmedRaw);
              const normalizedState = normalizeGameState(parsedData, language);
              localStorage.removeItem(LEGACY_LANDLORD_STORAGE_KEY);
              // Save immediately in the new encrypted format
              saveGameState(normalizedState);
              return processOfflineProgress(normalizedState);
            } else {
              // Encrypted Format: split at the last dot
              const lastDotIndex = trimmedRaw.lastIndexOf(".");
              if (lastDotIndex === -1) {
                throw new Error("Missing checksum dot separator");
              }
              const encodedPart = trimmedRaw.substring(0, lastDotIndex);
              const checksumHex = trimmedRaw.substring(lastDotIndex + 1);

              // Recompute checksum
              let recomputedChecksum =
                encodedPart
                  .split("")
                  .reduce((acc, c) => acc + c.charCodeAt(0), 0) % 65536;
              if (!isFinite(recomputedChecksum)) {
                recomputedChecksum = 0;
              }

              if (
                recomputedChecksum.toString(16).toLowerCase() !==
                checksumHex.toLowerCase()
              ) {
                console.warn(
                  "Save data tampered or corrupted (checksum mismatch)",
                );
                initialCorruptionDetected = true;
                return createDefaultGameState(language);
              }

              const decodedJson = decodeURIComponent(escape(atob(encodedPart)));
              parsedData = JSON.parse(decodedJson);
              const normalizedState = normalizeGameState(parsedData, language);
              localStorage.removeItem(LEGACY_LANDLORD_STORAGE_KEY);
              return processOfflineProgress(normalizedState);
            }
          } catch (error) {
            console.warn(
              "Unable to load saved Money Game state, resetting.",
              error,
            );
            const legacy = migrateLegacyStateIfNeeded(language);
            if (legacy) {
              return legacy;
            }
            initialCorruptionDetected = true;
            return createDefaultGameState(language);
          }
        }

        return (
          migrateLegacyStateIfNeeded(language) ||
          createDefaultGameState(language)
        );
      }

      function saveGameState(state) {
        try {
          const stateToSave = {
            ...state,
            version: GAME_STATE_VERSION,
            settings: {
              ...state.settings,
              lastSavedAt: new Date().toISOString(),
            },
          };
          const json = JSON.stringify(stateToSave);
          const encoded = btoa(unescape(encodeURIComponent(json)));
          let checksum =
            encoded.split("").reduce((acc, c) => acc + c.charCodeAt(0), 0) %
            65536;
          if (!isFinite(checksum)) {
            checksum = 0;
          }

          const saveString = encoded + "." + checksum.toString(16);
          localStorage.setItem(GAME_STATE_STORAGE_KEY, saveString);
        } catch (error) {
          console.error(
            "Unable to save Game State in encrypted format:",
            error,
          );
        }
      }

      const getWarStatusIndicators = (state, language) => {
        const currentStage = state.rpg?.currentStage || 1;
        const cash = state.wallet?.cash || 0;
        const propertiesCount = Object.keys(
          state.landlord?.properties || {},
        ).length;
        const rebirths = state.landlord?.rebirthCount || 0;
        const isKo = language === "ko";

        // Frontline Stability
        let stability = isKo ? "안정" : "SECURE";
        let stabilityColor = "text-emerald-400 font-bold";
        if (currentStage > 100) {
          stability = isKo ? "치명적 붕괴" : "CRITICAL COLLAPSE";
          stabilityColor = "text-red-500 animate-pulse font-black";
        } else if (currentStage > 50) {
          stability = isKo ? "경보 (워프 전)" : "UNSTABLE PRE-WARP";
          stabilityColor = "text-amber-500 font-bold";
        } else if (currentStage > 10) {
          stability = isKo ? "교전 진행 중" : "ENGAGED";
          stabilityColor = "text-yellow-400 font-bold";
        }

        // Logistics Status
        let logistics = isKo ? "보급 부족 경보" : "CRITICAL DEPLETION";
        let logisticsColor = "text-red-400 animate-pulse font-bold";
        if (cash > 100000000) {
          logistics = isKo ? "과잉 보급" : "SURPLUS OVERLOAD";
          logisticsColor = "text-emerald-400 font-black";
        } else if (cash > 1000000) {
          logistics = isKo ? "예비물자 충분" : "STABLE RESERVES";
          logisticsColor = "text-green-400 font-bold";
        } else if (cash > 10000) {
          logistics = isKo ? "한계 공급" : "MARGINAL SUPPLY";
          logisticsColor = "text-yellow-400 font-bold";
        }

        // Command Prestige
        const prestigeLevel = 1 + rebirths + Math.floor(propertiesCount / 2);
        let prestigeLabel = isKo ? "후방 지휘관" : "REAR ADMIRAL";
        if (prestigeLevel > 15) {
          prestigeLabel = isKo ? "최고 사령관" : "SUPREME CHIEF";
        } else if (prestigeLevel > 8) {

              }
            } else {
              const lastDotIndex = rawString.lastIndexOf(".");
              if (lastDotIndex === -1) {
                setImportError(
                  language === "ko"
                    ? "저장 코드 형식이 올바르지 않습니다."
                    : "Invalid save code format.",
                );
                return;
              }
              const encodedPart = rawString.substring(0, lastDotIndex);
              const checksumHex = rawString.substring(lastDotIndex + 1);

                encodedPart
                  .split("")
                  .reduce((acc, c) => acc + c.charCodeAt(0), 0) % 65536;
              if (!isFinite(recomputedChecksum)) {
                recomputedChecksum = 0;
              }

                recomputedChecksum.toString(16).toLowerCase() !==
                checksumHex.toLowerCase()
              ) {
                setImportError(
                  language === "ko"
                    ? "저장 코드가 손상되었거나 변조되었습니다. 올바른 코드를 확인하십시오."

            const consumed = new Set(consumedItems.map((item) => item.instanceId));

          const safeLevel = clampNumber(

            MAX_ENHANCE_LEVEL,

          const safeLevel = clampNumber(
            Math.floor(toFiniteNumber(level, 0)),
            0,
            MAX_ENHANCE_LEVEL,

          return clampNumber(0.9 - safeLevel * 0.06, 0.3, 0.9, 0.9);

        // safe zone (0 to 9): 0%
        // high risk (10 to 19): 20%
        // extreme risk (20 to 29): 70%
        const getBreakageChance = (level) => {
          const safeLevel = Math.floor(toFiniteNumber(level, 0));
          if (safeLevel < 10) return 0;
          if (safeLevel < 20) return 0.2;
          return 0.7;

        // J-3G: Salvage payout — scales by enhancement level and rarity
        // P-2D: Safe-Forge exploit gate: level < 15 shatters yield a flat nominal 5 shards
        const getSalvagePayout = (enhanceLevel, rarity) => {
          const level = Math.max(
            0,
            Math.floor(toFiniteNumber(enhanceLevel, 0)),
          );
          const rarityMultipliers = {
            common: 1,
            uncommon: 1.2,
            rare: 1.5,
            epic: 2,
            legendary: 3,
            mythic: 5,
          };
          const rarityMult =
            rarityMultipliers[String(rarity).toLowerCase()] || 1;
          // Base: 10 shards + 15 per level, scaled by rarity
          const base = 10 + level * 15;
          const normalPayout = Math.floor(base * rarityMult);
          if (level < 15) {
            return 5;
          }
          return Math.max(5, normalPayout);

        const showForgePrestigeAnnouncement = (level, itemName) => {

        const enhanceWeaponItem = (instanceId, useStabilizer = false) => {

          if (!item || item.type !== "weapon") return;
          if (item.broken === true) return; // J-3G: broken weapons cannot be enhanced
          if (item.locked === true) return; // J-3I: locked weapons cannot be enhanced — must unlock first

            Math.floor(toFiniteNumber(item.enhanceLevel, 0)),

        const convertShardsToHeroPowers = (amount, stateArg = gameState) => {

          if (!isFinite(amount) || !Number.isInteger(amount) || amount <= 0) {

            );

          const cost = cleanAmount * SHARD_TO_TOKEN_RATE;
          const currentShards = toFiniteNumber(
            stateArg?.enhancement?.refinedShards,
            0,

            );

        window.convertShardsToHeroPowers = convertShardsToHeroPowers;

        // L-5B: Bulk shard → token conversion — all shards at once (100:1 rate)
        const convertAllShardsToHeroPowers = () => {

            0,
          );
          const maxHeroPowers = Math.floor(currentShards / SHARD_TO_TOKEN_RATE);
          // Gate 1: at least 100 shards available
          if (currentShards < SHARD_TO_TOKEN_RATE) {
            return { success: false, reason: "insufficient_shards" };

          // Gate 2: Math.floor result is a positive integer
          if (maxHeroPowers < 1) {
            return { success: false, reason: "zero_tokens" };
          }
          // Gate 3: no NaN or Infinity
          if (!isFinite(maxHeroPowers) || !Number.isInteger(maxHeroPowers)) {
            return { success: false, reason: "invalid_token_count" };
          }
          // Gate 4: deduction does not underflow
          if (maxHeroPowers * SHARD_TO_TOKEN_RATE > currentShards) {
            return { success: false, reason: "underflow_guard" };
          }
          // All gates pass — commit
          updateGameState((prev) => {

            if (shardsDeducted > shards) return prev;
            return {

              wallet: {
                ...prev.wallet,
                blackMarketTokens: Math.max(

                  toFiniteNumber(prev.wallet?.blackMarketTokens, 0) + tokens,

              enhancement: {
                ...prev.enhancement,
                refinedShards: Math.max(0, shards - shardsDeducted),

              : null;

          );

        window.rollWeaponModification = rollWeaponModification;

        const autoEnhanceWeaponItem = (instanceId, targetLevel = 10) => {

            if (!item || item.type !== "weapon" || item.broken === true || item.locked === true)
              return prev;
            let level = clampNumber(
              Math.floor(toFiniteNumber(item.enhanceLevel, 0)),

            );
            const safeTarget = Math.min(MAX_ENHANCE_LEVEL, Math.max(level, Math.floor(toFiniteNumber(targetLevel, 10))));

              remainingCash -= cost;

              const success = Math.random() < getEnhanceChance(level);

                level += 1;
                successes += 1;

                failures += 1;
                level = Math.max(0, level - 1);

            const weaponType = getWeaponType(item);
            const nextWeaponLevels = { ...(prev.enhancement?.weaponLevels || {}) };
            const nextWeaponMastery = { ...(prev.enhancement?.weaponMastery || {}) };
            if (weaponType) {
